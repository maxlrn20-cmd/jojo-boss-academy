<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jojo Boss"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-512.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>Jojo Boss Academy</title>
<meta name="theme-color" content="#F5F5F7">
<style>
/* Layout : rail latéral sur ordinateur, barre d'onglets en bas sur mobile ; contenu centré en colonne de lecture. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface2:#F2F2F5; --surface3:#E8E8ED;
  --ink:#1D1D1F; --ink2:#6E6E73; --line:rgba(0,0,0,.09);
  --rose:#F3C6D2; --rose2:#FCEEF2; --framboise:#D2335F; --framboise2:#B0244C;
  --sauge:#8FAE8C; --sauge2:#EAF4EA; --turq:#0A84A8; --turq2:#E6F4F8; --beige:#E8D4BC; --gold:#C98A0B; --gold2:#FFF4DC;
  --ok:#248A3D; --ok2:#E7F6EA; --ko:#D70015; --ko2:#FDECEC;
  --shadow:0 1px 1px rgba(0,0,0,.03),0 4px 18px rgba(0,0,0,.06);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-hand:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --r:20px; --r-s:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --surface3:#3A3A3C;
  --ink:#F5F5F7; --ink2:#98989D; --line:rgba(255,255,255,.1);
  --rose:#5A2A3A; --rose2:#2E1A21; --framboise:#FF6B8E; --framboise2:#FF8FA9;
  --sauge:#A7C4A3; --sauge2:#1E2A1F; --turq:#64D2FF; --turq2:#0F2630; --beige:#5A4A3C; --gold:#FFD60A; --gold2:#2E2810;
  --ok:#30D158; --ok2:#132A19; --ko:#FF453A; --ko2:#331513;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --surface3:#3A3A3C;
  --ink:#F5F5F7; --ink2:#98989D; --line:rgba(255,255,255,.1);
  --rose:#5A2A3A; --rose2:#2E1A21; --framboise:#FF6B8E; --framboise2:#FF8FA9;
  --sauge:#A7C4A3; --sauge2:#1E2A1F; --turq:#64D2FF; --turq2:#0F2630; --beige:#5A4A3C; --gold:#FFD60A; --gold2:#2E2810;
  --ok:#30D158; --ok2:#132A19; --ko:#FF453A; --ko2:#331513;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.005em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,50px);line-height:1.05}
h2{font-size:clamp(23px,3.6vw,30px);line-height:1.15}
h3{font-size:20px;line-height:1.25}
p{margin:0}
a{color:var(--framboise)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px;border-radius:8px}
.hand{font-family:var(--f-hand);font-size:1.35em;line-height:1.15}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink2)}
.small{font-size:14px}
.tnum{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand .mini{width:40px;height:40px;flex:none;border-radius:50%;background:var(--rose2);overflow:hidden;display:grid;place-items:center}
.brand .mini svg{width:46px;height:46px;margin-top:6px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.top .grow{flex:1}
.brand>span:last-child{min-width:0;overflow:hidden}
@media (max-width:440px){.top .brand>span:last-child{display:none}}
.side .holly-say{grid-template-columns:56px 1fr}.side .holly-say .bubble{font-size:17px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--rose)}
.iconbtn svg{width:20px;height:20px}
.xpchip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.xpchip .lv{background:var(--framboise);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 110px;min-width:0}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.read{max-width:760px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11.5px;font-weight:600;color:var(--ink2);text-decoration:none;background:none;border:0;cursor:pointer}
.tabbar svg{width:23px;height:23px}
.tabbar .on{color:var(--framboise)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.nav a svg{width:20px;height:20px;color:var(--ink2);flex:none}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--rose2);color:var(--framboise2)}
.nav a.on svg{color:var(--framboise)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
@media (min-width:960px){
  .app{grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px}
  .tabbar{display:none}
  .top .brand{display:none}
  main{padding-block:28px 60px}
}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(40,20,30,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet .nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.tint-rose{background:var(--rose2);border-color:transparent}
.tint-sauge{background:var(--sauge2);border-color:transparent}
.tint-turq{background:var(--turq2);border-color:transparent}
.tint-gold{background:var(--gold2);border-color:transparent}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;min-height:46px}
.btn.pri{background:var(--framboise);color:#fff}
.btn.pri:hover{background:var(--framboise2)}
.btn.sec{background:var(--surface);border-color:var(--rose);color:var(--ink)}
.btn.sec:hover{background:var(--rose2)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.turq{background:var(--turq);color:#fff}
.btn.sm{padding:8px 14px;font-size:14px;min-height:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.decouvrir{background:var(--surface3);color:var(--ink2)}
.pill.encours{background:var(--turq2);color:var(--turq)}
.pill.revoir{background:var(--gold2);color:var(--gold)}
.pill.maitrisee{background:var(--ok2);color:var(--ok)}
.pill.fav{background:var(--rose2);color:var(--framboise)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--framboise);background:var(--rose2);color:var(--framboise2)}
.bar{height:10px;border-radius:999px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--framboise),#E7739A);border-radius:inherit;transition:width .6s ease}
.bar.turq>i{background:linear-gradient(90deg,var(--turq),#7ED3CD)}
.bar.sauge>i{background:var(--sauge)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:28px;font-family:var(--f-display);font-weight:400;line-height:1.1}
.stat span{font-size:13px;color:var(--ink2)}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.input:focus{border-color:var(--turq);outline:none}
textarea.input{min-height:180px;resize:vertical;line-height:1.55}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{flex:none;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg)}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.list li::marker{color:var(--framboise)}
.dl{display:grid;gap:10px}
.dl>div{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:6px 16px;padding:12px 0;border-top:1px solid var(--line)}
.dl>div:first-child{border-top:0}
.dl dt{font-weight:700}
.dl dd{margin:0;min-width:0}
@media (max-width:620px){.dl>div{grid-template-columns:1fr}}
.ref{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.note{border-left:4px solid var(--gold);background:var(--gold2);padding:12px 14px;border-radius:0 12px 12px 0;font-size:14.5px}
.note.turq{border-color:var(--turq);background:var(--turq2)}
.empty{text-align:center;padding:26px;color:var(--ink2)}

/* Holly */
.holly-svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:relative;background:var(--surface);border:1.5px solid var(--rose);border-radius:20px;padding:14px 16px;font-family:var(--f-hand);font-size:23px;line-height:1.18;color:var(--ink)}
.holly-say{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.holly-say .who{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--framboise);display:block;margin-bottom:2px}
.holly-say.sm{grid-template-columns:72px 1fr}
.holly-say.sm .bubble{font-size:20px;padding:10px 14px}
.bob{animation:bob 4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-4px) rotate(1deg)}}
.breathe{animation:breathe 5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.025,0.985)}}
body.focus .deco,body.focus .holly-say:not(.keep),body.focus .love{display:none!important}

/* Hero */
.hero{display:grid;grid-template-columns:1.25fr .9fr;gap:20px;align-items:center;background:linear-gradient(160deg,var(--rose2),var(--surface2));border-radius:28px;padding:clamp(20px,4vw,40px);position:relative;overflow:hidden}
.hero .art{position:relative;max-width:330px;justify-self:center;width:100%}
.hero .motifs{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-around;opacity:.95;pointer-events:none}
.hero .slogan{font-family:var(--f-hand);font-size:clamp(22px,3.2vw,28px);color:var(--framboise2);line-height:1.15}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .art{max-width:230px;grid-row:1}}
.motif-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Library */
.chcard{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;width:100%}
.chcard:hover{transform:translateY(-2px);border-color:var(--rose)}
.chcard .num{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--framboise)}
.chcard h3{font-size:18.5px}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--framboise) calc(var(--p)*1%),var(--surface3) 0);display:grid;place-items:center;flex:none}
.ring>span{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11.5px;font-weight:800}
.subjhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.subjhead .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--turq2);color:var(--turq)}
.subjhead .ic svg{width:30px;height:30px}

/* Quiz */
.q-opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--surface);text-align:left;width:100%;font-size:16px}
.q-opt:hover{border-color:var(--rose)}
.q-opt .box{width:22px;height:22px;flex:none;border:2px solid var(--ink2);border-radius:50%;margin-top:1px;display:grid;place-items:center}
.q-opt.multi .box{border-radius:6px}
.q-opt.sel{border-color:var(--framboise);background:var(--rose2)}
.q-opt.sel .box{border-color:var(--framboise);background:var(--framboise)}
.q-opt.sel .box::after{content:"";width:8px;height:8px;background:#fff;border-radius:inherit}
.q-opt.good{border-color:var(--ok);background:var(--ok2)}
.q-opt.bad{border-color:var(--ko);background:var(--ko2)}
.q-opt[disabled]{cursor:default}
.diff{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok2)}
.fb.ko{background:var(--ko2)}
.level-card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;background:var(--surface);text-align:left}
.level-card.on{border-color:var(--framboise);background:var(--rose2)}

/* Flashcards */
.flip{perspective:1400px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:left}
.flip .inner{position:relative;min-height:280px;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);overflow:auto}
.flip .back{transform:rotateY(180deg);background:var(--turq2)}
.flip .face .k{position:absolute;top:16px;left:20px}
.flip .face .t{font-family:var(--f-display);font-size:clamp(20px,3vw,26px);line-height:1.25}
.flip .back .t{font-family:var(--f-ui);font-size:18px;font-weight:500}
@media (prefers-reduced-motion:reduce){.flip .inner,.bar>i{transition:none}.bob,.breathe{animation:none}}

/* Travel */
.map{width:100%;height:auto;display:block;border-radius:20px;background:var(--turq2)}
.map .land{fill:var(--surface);stroke:var(--line);stroke-width:.8}
.pin{cursor:pointer}
.pin circle.halo{fill:var(--framboise);opacity:.18}
.pin.locked circle{fill:var(--ink2)}
.pin text{font:700 15px var(--f-ui);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.scene{border-radius:18px;overflow:hidden;line-height:0}
.scene svg{width:100%;height:auto;display:block;aspect-ratio:400/220}
.stamp{border:2px dashed var(--framboise);border-radius:12px;padding:6px 10px;color:var(--framboise);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-4deg);display:inline-block}

/* Love box */
.env{position:relative;border-radius:18px;padding:18px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;cursor:pointer;border:1.5px solid var(--rose);background:var(--surface);text-align:left;width:100%}
.env.locked{cursor:default;border-style:dashed;background:var(--surface2);color:var(--ink2)}
.env.open{background:linear-gradient(150deg,var(--rose2),var(--surface))}
.env .msg{font-family:var(--f-hand);font-size:24px;line-height:1.2;color:var(--ink)}

/* Overlays */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (min-width:960px){.toast{bottom:28px}}
.celebrate{position:fixed;inset:0;z-index:95;background:rgba(40,20,30,.45);display:grid;place-items:center;padding:16px}
.celebrate .card{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.celebrate .holly-wrap{width:190px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:96}
.search-ov{position:fixed;inset:0;z-index:80;background:rgba(40,20,30,.35);display:flex;justify-content:center;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px))}
.search-ov>div{background:var(--surface);width:100%;max-width:720px;border-radius:22px;padding:16px;max-height:85vh;display:flex;flex-direction:column;gap:12px}
.search-ov .res{overflow:auto;display:flex;flex-direction:column;gap:6px}
.res-item{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.res-item:hover,.res-item:focus{background:var(--surface2)}
.res-item mark{background:var(--gold2);color:inherit;border-radius:3px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--surface2)}
.timer.warn{background:var(--ko2);color:var(--ko)}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hist{list-style:none;margin:0;padding:0}
.hist li:first-child{border-top:0}

/* ===== Style Apple ===== */
body{font-size:17px;line-height:1.47;letter-spacing:-.012em;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,.disp{font-weight:700;letter-spacing:-.025em}
h1{font-size:clamp(32px,6vw,52px);line-height:1.06}
h2{font-size:clamp(22px,3.4vw,28px);letter-spacing:-.02em}
h3{font-size:19px;font-weight:600;letter-spacing:-.015em}
.eyebrow{letter-spacing:.02em;text-transform:none;font-size:13px;font-weight:600;color:var(--framboise)}
.hand{font-style:italic;font-size:1.15em}
.top{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.brand b{font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand small{letter-spacing:.02em;text-transform:none;font-size:12px}
.iconbtn{border:0;background:var(--surface3);border-radius:50%;width:36px;height:36px}
.iconbtn:hover{background:var(--line)}
.iconbtn svg{width:18px;height:18px}
.xpchip{border:0;background:var(--surface3)}
.tabbar{background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}

@media (min-width:960px){.side{background:color-mix(in srgb,var(--surface2) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-right:.5px solid var(--line);padding:22px 12px}}
.nav a{border-radius:8px;padding:7px 10px;font-weight:500;font-size:14px}
.nav a svg{color:var(--framboise)}
.nav a.on{background:var(--framboise);color:#fff}
.nav a.on svg{color:#fff}
.nav a:hover:not(.on){background:var(--surface3)}
.card{border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card.flat{background:var(--surface2);box-shadow:none}
:root[data-theme="dark"] .card.flat{background:var(--surface)}
.btn{font-weight:600;font-size:16px;border:0;min-height:44px;padding:11px 22px;letter-spacing:-.01em;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri:hover{background:var(--framboise);filter:brightness(1.07)}
.btn.sec{background:var(--surface3);color:var(--ink)}
.btn.sec:hover{background:var(--surface3);filter:brightness(.97)}
.btn.ghost{background:transparent;color:var(--framboise);border:0}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{font-size:14px;min-height:34px;padding:7px 14px}
.pill{font-weight:600;font-size:12px;padding:3px 9px}
.seg{background:var(--surface3);border-radius:10px;padding:2px}
.seg button{border-radius:8px;padding:6px 14px;font-weight:500;font-size:14px;color:var(--ink)}
.seg button.on{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button.on{background:#636366}
.chip{border:0;background:var(--surface3);font-weight:500}
.chip.on{background:var(--framboise);color:#fff}
.bar{height:6px;background:var(--surface3)}
.bar>i{background:var(--framboise)}
.bar.turq>i{background:var(--turq)}
.stat b{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em}
.input{border:0;background:var(--surface2);border-radius:12px;box-shadow:inset 0 0 0 .5px var(--line)}
.input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--framboise) 35%,transparent)}
.tabs{background:var(--surface3);border-radius:10px;padding:2px;gap:2px;align-self:flex-start;max-width:100%}
.tabs button{border-radius:8px;padding:6px 14px;font-weight:500;color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .tabs button.on{background:#636366}
.note{border-left:0;border-radius:14px}
.bubble{border:0;background:var(--surface2);border-radius:18px 18px 18px 6px;font-size:19px;line-height:1.3;font-style:italic}
.card .bubble,.tint-rose .bubble{background:var(--surface)}
.holly-say .who{letter-spacing:.02em;text-transform:none;font-style:normal;font-size:12px}
.holly-say.sm .bubble{font-size:17px}
.hero{background:linear-gradient(180deg,var(--rose2),var(--surface));box-shadow:var(--shadow);border-radius:28px}
.hero .slogan{font-style:italic;font-size:clamp(20px,2.8vw,25px)}
.chcard{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.chcard:hover{transform:translateY(-3px) scale(1.005);box-shadow:0 10px 30px rgba(0,0,0,.1)}
.chcard .num{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em}
.q-opt{border:0;background:var(--surface2);border-radius:14px;box-shadow:inset 0 0 0 1px transparent}
.q-opt:hover{background:var(--surface3)}
.q-opt.sel{background:var(--rose2);box-shadow:inset 0 0 0 2px var(--framboise)}
.q-opt.good{background:var(--ok2);box-shadow:inset 0 0 0 2px var(--ok)}
.q-opt.bad{background:var(--ko2);box-shadow:inset 0 0 0 2px var(--ko)}
.level-card{border:0;background:var(--surface2)}
.level-card.on{background:var(--rose2);box-shadow:inset 0 0 0 2px var(--framboise)}
.flip .face{border:0;border-radius:26px}
.flip .face .t{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em}
.env{border:0;box-shadow:var(--shadow);border-radius:20px}
.env.locked{border:0;box-shadow:none}
.env .msg{font-style:italic;font-size:21px}
.sheet,.search-ov,.celebrate{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet>div{border-radius:14px 14px 0 0}
.search-ov>div{border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.celebrate .card{border-radius:22px}
.toast{background:color-mix(in srgb,var(--ink) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-weight:600}
.stamp{font-weight:700;letter-spacing:.04em}
.eli{border:0;border-radius:18px}
.holly-btn{border:0;background:var(--turq2);font-weight:600;letter-spacing:0}
.secnum{font-family:var(--f-display);font-weight:700}
.tbl th{letter-spacing:.01em;text-transform:none;font-size:13px;font-weight:600}
.juris{border:0}
.badge{background:var(--surface2)}
.btn.pri,.btn.pri:hover{background:#D2335F;color:#fff}
.nav a.on{background:#D2335F}
.chip.on{background:#D2335F}
.xpchip .lv{background:#D2335F}

/* ===== Apple, deuxième passe ===== */
body{font-size:17px}
main{padding-block:34px 120px}
.wrap{gap:28px}
h1{font-weight:700;letter-spacing:-.035em;line-height:1.04}
h2{font-weight:700;letter-spacing:-.028em}
.muted{color:var(--ink2)}
.tint-rose,.tint-gold,.tint-sauge{background:var(--surface)}
.tint-turq{background:var(--surface)}
.hero{background:var(--surface);box-shadow:var(--shadow)}
.hero.home{grid-template-columns:1fr;justify-items:center;text-align:center;padding:clamp(36px,7vw,72px) clamp(20px,5vw,56px) 0;gap:28px;background:linear-gradient(180deg,var(--surface) 55%,var(--rose2))}
.hero.home .stack{align-items:center}
.hero.home h1{font-size:clamp(40px,7.4vw,76px)}
.hero.home p{margin-inline:auto;color:var(--ink2);font-size:clamp(18px,2.2vw,21px)!important}
.hero.home .art{grid-row:auto;max-width:300px;margin-bottom:-6px}
.hero.home .row{justify-content:center;gap:22px}
.hero .slogan,.hero.home p.slogan{font-family:var(--f-ui);font-style:normal;font-weight:700;letter-spacing:-.02em;font-size:clamp(20px,2.6vw,26px)!important;background:linear-gradient(90deg,#E0406E,#B04CC8 55%,#3A7BEA);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.btn.link{background:none;color:var(--framboise);padding-inline:4px;min-height:auto;font-weight:500}
.btn.link:hover{text-decoration:underline;filter:none}
.bubble,.holly-say.sm .bubble{font-family:var(--f-ui);font-style:normal;font-size:16.5px;line-height:1.4;font-weight:450}
.hand{font-family:var(--f-ui);font-style:normal;font-weight:600;letter-spacing:-.02em;font-size:1.05em}
.env .msg{font-family:var(--f-ui);font-style:normal}
.eyebrow{font-weight:600;font-size:14px;letter-spacing:-.005em}
.card{padding:24px}
.nav{gap:1px;display:flex;flex-direction:column}
.nav a{padding:6px 10px;font-size:13.5px}
.nav a svg{width:17px;height:17px}
.nav a.on{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.nav a.on svg{color:var(--framboise)}
@media (min-width:960px){.app{grid-template-columns:230px 1fr}}
.top{border-bottom:.5px solid var(--line)}
.stat b{font-size:34px}
.note{background:var(--surface2)}
.note.turq{background:var(--surface2)}
.chcard{padding:22px}
.pill.fav{background:var(--surface3);color:var(--ink)}
@media (max-width:600px){.br-d{display:none}.hero.home h1{font-size:40px}}

/* ===== Feuille « Plus » façon iOS ===== */
.sheet{align-items:flex-end;animation:fadein .2s ease}
.psheet{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:6px;animation:sheetup .32s cubic-bezier(.2,.9,.3,1)}
@media (min-width:600px){.sheet{align-items:center}.psheet{border-radius:16px;max-height:86vh;box-shadow:0 30px 80px rgba(0,0,0,.3)}}
@keyframes sheetup{from{transform:translateY(40px);opacity:.4}}
@keyframes fadein{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.psheet,.sheet{animation:none}}
.psheet .grab{width:36px;height:5px;border-radius:3px;background:var(--surface3);align-self:center;margin:2px 0 8px}
.pclose{width:30px;height:30px;border-radius:50%;border:0;background:var(--surface3);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.pclose svg{width:14px;height:14px;stroke-width:2.6}
.plabel{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em;margin:14px 16px 6px}
.pgroup{background:var(--surface);border-radius:12px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:0 14px 0 14px;min-height:50px;background:none;border:0;text-align:left;color:var(--ink);text-decoration:none;cursor:pointer;font-size:17px;position:relative}
.prow:active{background:var(--surface3)}
@media (hover:hover){.prow:hover{background:var(--surface2)}}
.prow+.prow::before{content:"";position:absolute;top:0;right:0;left:56px;border-top:.5px solid var(--line)}
.prow .tile{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.prow .tile svg{width:18px;height:18px;stroke-width:2.1}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 0}
.pt{font-weight:400;letter-spacing:-.01em}
.ps{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchev{color:var(--ink2);opacity:.55;display:grid}
.pchev svg{width:16px;height:16px;stroke-width:2.4}
.ptoggle{width:51px;height:31px;border-radius:999px;background:var(--surface3);position:relative;flex:none;transition:background .2s}
.ptoggle i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.ptoggle.on{background:#34C759}
.ptoggle.on i{transform:translateX(20px)}
.pacct{min-height:76px}
.pacct .av{width:56px;height:56px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface3);display:grid;place-items:center;overflow:hidden}
.pacct .pt{font-size:19px;font-weight:600}
.prow.pgoogle .pt{color:#007AFF}
:root[data-theme="dark"] .prow.pgoogle .pt{color:#0A84FF}
.pnote{font-size:13px;color:var(--ink2);margin:6px 16px 0;line-height:1.35}
.desk-only{display:none}@media (min-width:960px){.desk-only{display:grid}}
.psheet>*{flex-shrink:0}
.sheet>.psheet{--grp:#F2F2F7;--cell:#FFFFFF;background:var(--grp);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0}@media (min-width:600px){.sheet>.psheet{border-radius:16px}}
.pgroup{background:var(--cell)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .psheet{--grp:#000;--cell:#1C1C1E}}
:root[data-theme="dark"] .psheet{--grp:#000;--cell:#1C1C1E}
:root[data-theme="dark"] .pclose,:root[data-theme="dark"] .ptoggle{background:#39393D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pclose,:root:not([data-theme="light"]) .ptoggle{background:#39393D}}
.ptoggle.on{background:#34C759!important}
@media (min-width:600px){.psheet .grab{display:none}}

/* ===== Animations douces ===== */
:root{--ease:cubic-bezier(.22,.8,.25,1);--spring:cubic-bezier(.34,1.4,.5,1)}
html{scroll-behavior:smooth}
.wrap.enter>*{animation:rise .42s var(--ease) both}
.wrap.enter>*:nth-child(2){animation-delay:.04s}.wrap.enter>*:nth-child(3){animation-delay:.08s}.wrap.enter>*:nth-child(4){animation-delay:.12s}.wrap.enter>*:nth-child(n+5){animation-delay:.15s}
.wrap.swap .card,.wrap.swap .flip{animation:swapin .34s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes swapin{from{opacity:0;transform:translateX(14px)}}
.btn,.chip,.q-opt,.level-card,.prow,.iconbtn,.seg button,.tabs button,.chcard,.env,.tabbar a,.tabbar button,.nav a{transition:transform .18s var(--ease),background-color .2s,box-shadow .2s,color .2s,opacity .2s,filter .2s}
.btn:active,.chip:active,.iconbtn:active,.level-card:active,.chcard:active,.seg button:active{transform:scale(.96)}
.q-opt:active:not([disabled]){transform:scale(.985)}
.tabbar a:active svg,.tabbar button:active svg{transform:scale(.88)}
.tabbar svg{transition:transform .18s var(--spring)}
.tabbar .on svg{animation:tabpop .35s var(--spring)}
@keyframes tabpop{40%{transform:scale(1.14)}}
.q-opt.good{animation:pop .4s var(--spring)}
.q-opt.bad{animation:nudge .38s var(--ease)}
@keyframes pop{45%{transform:scale(1.02)}}
@keyframes nudge{20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
.fb{animation:rise .32s var(--ease) both}
.q-opt .box{transition:background-color .18s,border-color .18s,transform .2s var(--spring)}
.q-opt.sel .box{transform:scale(1.08)}
.flip .inner{transition:transform .6s var(--spring)}
.bar>i{transition:width .7s var(--ease)}
.toast{opacity:0;transform:translate(-50%,12px) scale(.97);transition:opacity .25s var(--ease),transform .3s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.celebrate{animation:fadein .2s ease}
.celebrate .card{animation:popin .45s var(--spring)}
@keyframes popin{from{opacity:0;transform:scale(.92) translateY(8px)}}
.search-ov{animation:fadein .18s ease}.search-ov>div{animation:popin .3s var(--ease)}
.ptoggle,.ptoggle i{transition:background-color .25s,transform .3s var(--spring)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== Écrans simplifiés ===== */
.pgroup{background:var(--cell,var(--surface));border-radius:12px;overflow:hidden}
.wrap .pgroup{box-shadow:var(--shadow)}
.wrap .plabel{margin:4px 16px 8px}
.pcount{color:var(--ink2);font-size:15px;margin-right:2px}
.seg.wide{display:flex;width:100%;border-radius:9px}
.seg.wide button{flex:1;padding:7px 6px;text-align:center}
.btn.block{width:100%}
.grings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.gring{display:flex;flex-direction:column;align-items:center;gap:2px}
.gring svg{width:72px;height:72px}
.gring svg circle:last-child{transition:stroke-dashoffset .9s var(--ease)}
.gring b{font-size:15px;margin-top:4px}
.gring span{font-size:12px;color:var(--ink2)}
.hero.home h1{font-size:clamp(36px,6.6vw,68px)}
.hero.home .art{max-width:230px}
.searchfield{display:flex;align-items:center;gap:8px;background:var(--surface3);border-radius:10px;padding:0 10px;height:38px;color:var(--ink2)}
.searchfield svg{width:17px;height:17px;flex:none}
.searchfield input{border:0;background:none;outline:none;flex:1;font-size:17px;color:var(--ink);min-width:0}
.selpill select{appearance:none;-webkit-appearance:none;border:0;background:var(--surface3);border-radius:999px;padding:7px 28px 7px 14px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.prow .num-tile{background:var(--surface2);color:var(--framboise);font-weight:700;font-size:15px}
.mini-ring{--p:0;width:22px;height:22px;border-radius:50%;flex:none;background:conic-gradient(var(--c,#0A84FF) calc(var(--p)*1%),var(--surface3) 0);-webkit-mask:radial-gradient(circle,transparent 6px,#000 6.5px);mask:radial-gradient(circle,transparent 6px,#000 6.5px)}
.favstar{color:#FF9500;font-size:14px}
.pdetails{background:var(--surface);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow)}
.pdetails summary{cursor:pointer;display:flex;justify-content:space-between;font-weight:500;list-style:none}
.pdetails summary::-webkit-details-marker{display:none}
.pdetails summary::after{content:"›";color:var(--ink2);transform:rotate(90deg);transition:transform .2s;margin-left:8px}
.pdetails[open] summary::after{transform:rotate(-90deg)}
.pdetails summary .muted{margin-left:auto;font-weight:400}
.bignum{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1}

/* ===== Flashcard qui se retourne ===== */
.fcard{perspective:1600px;-webkit-tap-highlight-color:transparent}
.fcard .inner{min-height:min(62vh,440px);transition:transform .7s cubic-bezier(.3,1.25,.45,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.fcard.on .inner{transform:rotateY(180deg)}
.fcard:active .inner{scale:.985}
.fcard .face{position:absolute;inset:0;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.fcard .front{background:linear-gradient(170deg,var(--surface) 55%,var(--rose2))}
.fcard .back{background:linear-gradient(170deg,var(--surface) 50%,var(--turq2));transform:rotateY(180deg)}

  summary: "L'État est le cadre habituel du pouvoir politique dans les sociétés modernes. Il se définit par trois éléments constitutifs : un territoire (élément matériel), une population (élément personnel) et un pouvoir politique organisé et souverain (élément formel), juridiquement personnifié comme personne morale. Il existe deux grandes formes d'États : l'État unitaire (un seul centre de décision, plus ou moins centralisé, déconcentré ou décentralisé) et l'État composé (confédération par traité ou État fédéral par constitution, organisé selon les principes d'autonomie et de participation).",

  const NAV = [

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c);
    const x = c.getContext("2d"); const W = c.width = innerWidth, Hh = c.height = innerHeight;
    const col = ["#C42E5C", "#F2C4CB", "#2E9C98", "#D9A53A", "#8FAE8C", "#F09AAE"];
    const P = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * Hh * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: Math.random() * 6.28, s: 5 + Math.random() * 6, c: col[Math.floor(Math.random() * col.length)] }));
    let f = 0; (function tick() { x.clearRect(0, 0, W, Hh); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (++f < 170) requestAnimationFrame(tick); else c.remove(); })();
  }
  /* Feuille « Plus », façon iOS : groupes arrondis, tuiles colorées, chevrons. */

  /* ---------- Recherche globale ---------- */
  let IDX;

    IDX = [];

  ui.search = (init = "") => {

  /* ---------- Routeur ---------- */

  function buildExam(scope) {
    let chs, label, mins, nq, nd;

    const cs = []; chs.forEach(id => J.byId[id].cases.forEach(k => cs.push({ ch: id, k })));
    if (cs.length) { const x = J.shuffle(cs)[0]; items.push({ t: "cas", ch: x.ch, prompt: x.k.facts + "\n\nQuestion : " + x.k.question, title: x.k.title, model: `Qualification : ${x.k.qualif}\nProblème : ${x.k.pb}\nRègle : ${x.k.rule}\nApplication : ${x.k.app}\nConclusion : ${x.k.concl}`, max: 5 }); }
    J.exam = { scope, label, items, i: 0, ans: {}, grades: {}, start: Date.now(), dur: mins * 60e3 };

  const fmt = ms => { ms = Math.max(0, ms); const m = Math.floor(ms / 60e3), s = Math.floor(ms % 60e3 / 1e3); return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; };

  ACT.exsel = b => { const E = J.exam, it = E.items[E.i], o = +b.dataset.o, multi = it.q.a.length > 1; let s = E.ans[E.i] || []; if (multi) s = s.includes(o) ? s.filter(x => x !== o) : s.concat(o); else s = [o]; E.ans[E.i] = s; ui.rerender(); };

  function examScore() {
    const E = J.exam; const q = E.items.map((it, i) => ({ it, i })).filter(x => x.it.t === "qcm");
    const qok = q.filter(x => { const s = E.ans[x.i] || []; return s.length === x.it.q.a.length && x.it.q.a.every(a => s.includes(a)); }).length;

    const P = hasCas ? { qcm: 10, def: 4, refl: 2, cas: 4 } : { qcm: 12, def: 5, refl: 3, cas: 0 };
    let note = q.length ? qok / q.length * P.qcm : 0;

  /* ======================= DEMANDE À HOLLY (IA) ======================= */
  /* Holly répond aux questions à partir des chapitres de l'appli : les chapitres les plus proches
     de la question sont joints à la demande ; s'il le faut, Holly lit d'autres chapitres ou cherche
     dans tous les cours grâce à deux outils. Fonctionne dans la version Claude du site. */
  (function () {
    const CHATKEY = "jojo-boss-academy-holly-chat";
    const IA = J.ia = { msgs: [], busy: false, ctl: null, scope: "", sample: undefined, tools: false };
    try { const m = JSON.parse(localStorage.getItem(CHATKEY) || "[]"); if (Array.isArray(m)) IA.msgs = m.filter(x => x && x.content && !x.pending).slice(-30); } catch (e) { }
    const saveChat = () => { try { localStorage.setItem(CHATKEY, JSON.stringify(IA.msgs.filter(x => !x.pending && x.content).slice(-30))); } catch (e) { } };

    /* Connexion à Claude : null hors de claude.ai (GitHub Pages, fichier ouvert en local). */
    /* ---------- Gemini (gratuit) : utilisé quand Claude n'est pas là (GitHub Pages, téléphone…) ---------- */
    const GKEY = "jojo-boss-academy-gemini-key", GMODEL = "gemini-3.5-flash-lite";
    const gKey = () => { try { return (localStorage.getItem(GKEY) || "").trim(); } catch (e) { return ""; } };
    function gemini(key) {
      const fn = async (input, o = {}) => {
        const msgs = typeof input === "string" ? [{ role: "user", content: input }] : input;
        const sys = msgs[0] && msgs[0].role === "user" && msgs[1] && msgs[1].role === "assistant" ? msgs[0].content : "";
        const rest = sys ? msgs.slice(2) : msgs;
        const body = { contents: rest.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })), generationConfig: { temperature: 0.4, maxOutputTokens: 2048 } };
        if (sys) body.systemInstruction = { parts: [{ text: sys }] };
        let r;
        try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GMODEL}:streamGenerateContent?alt=sse`, { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key }, body: JSON.stringify(body), signal: o.signal }); }
        catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network", message: String(e) }; }
        if (!r.ok) { let det = ""; try { const j = await r.json(); det = ((j.error && j.error.status) || "") + ""; } catch (e) { } const c = r.status === 429 ? "rate_limited" : [400, 401, 403].includes(r.status) ? "bad_key" : "server"; throw { code: c, message: `code ${r.status}${det ? " " + det : ""}` }; }
        const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "", text = "", fin = "";
        try {
          for (;;) {
            const { done, value } = await rd.read(); if (done) break;
            buf += dec.decode(value, { stream: true });
            let i; while ((i = buf.indexOf("\n")) >= 0) {
              const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
              if (!line.startsWith("data:")) continue;
              try { const j = JSON.parse(line.slice(5)); const c = j.candidates && j.candidates[0]; if (c) { const t = (c.content && c.content.parts || []).filter(x => !x.thought).map(x => x.text || "").join(""); if (t) { text += t; o.onText && o.onText({ text, delta: t }); } if (c.finishReason) fin = c.finishReason; } } catch (e) { }
            }
          }
        } catch (e) { if (e && e.name === "AbortError") throw { code: "cancelled", message: "", text }; throw { code: "network", message: String(e), text }; }
        if (!text && fin === "SAFETY") throw { code: "refused", message: "" };
        return { text, truncated: fin === "MAX_TOKENS" };
      };
      fn.limits = async () => ({ maxPromptBytes: 900000 });
      return fn;
    }
    IA.engine = "";
    IA.hasClaude = !!(window.claude && typeof window.claude.use === "function");
    const within = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(undefined), ms))]);
    IA.ready = (async () => {
      try {
        if (IA.hasClaude) {
          const s = await within(window.claude.use("sample"), 12000);
          if (s) { IA.engine = "claude"; within(s.limits(), 4000).then(l => { if (l) { IA.tools = !!l.tools; IA.max = l.maxPromptBytes; } }).catch(() => { }); return s; }
        }
      } catch (e) { }
      const k = gKey(); if (k) { IA.engine = "gemini"; return gemini(k); }
      return null;
    })().then(s => { IA.sample = s; if ((location.hash || "") === "#ia" && !IA.busy) { const t = document.getElementById("ia-q"); if (t && t.value) IA.draft = t.value; ui.rerender(); } return s; });
    J.setGeminiKey = k => { try { k ? localStorage.setItem(GKEY, k) : localStorage.removeItem(GKEY); } catch (e) { } if (IA.engine !== "claude") { IA.engine = k ? "gemini" : ""; IA.sample = k ? gemini(k) : null; IA.tools = false; } };
    J.geminiKey = gKey;

    /* ---------- Texte complet d'un chapitre ---------- */
    const SUB = id => J.SUBJECTS[J.byId[id].subject].short;
    const label = c => `${J.SUBJECTS[c.subject].short} ${c.num} — ${c.title}`;
    const TXT = {};
    function chText(c) {
      if (TXT[c.id]) return TXT[c.id];
      const L = [];
      L.push(`### CHAPITRE [${c.id}] ${label(c)}`, `Auteur du cours : ${c.author} · Source : ${c.source}`);
      if (c.note) L.push(`Remarque sur le document : ${c.note}`);
      L.push(`Résumé : ${c.summary}`, "Plan du cours :");
      c.plan.forEach(p => { L.push(`• ${p.h} (${p.p})`); p.pts.forEach(x => L.push(`   - ${x}`)); });
      if (c.defs.length) { L.push("Définitions :"); c.defs.forEach(d => L.push(`- ${d.t} : ${d.d} (${d.p})`)); }
      if (c.articles.length) { L.push("Articles :"); c.articles.forEach(a => L.push(`- ${a.ref} : ${a.txt}`)); }
      if (c.juris.length) { L.push("Jurisprudences :"); c.juris.forEach(j => L.push(`- ${j.name}, ${j.court}, ${j.date}. Faits : ${j.faits} Question : ${j.question} Solution : ${j.solution} Portée : ${j.portee}`)); }
      if (c.dates.length) L.push("Dates : " + c.dates.map(d => `${d.d} : ${d.e}`).join(" | "));
      if (c.authors.length) L.push("Auteurs : " + c.authors.map(a => `${a.n} (${a.i})`).join(" | "));
      [["Conditions", c.conditions], ["Exceptions", c.exceptions], ["Exemples", c.examples], ["Pièges", c.traps], ["À retenir", c.keys]].forEach(([t, arr]) => { if (arr && arr.length) L.push(`${t} : ` + arr.join(" | ")); });
      if (c.complements && c.complements.length) L.push("COMPLÉMENTS HORS COURS (corrections vérifiées, à signaler comme tels) : " + c.complements.join(" | "));
      c.eli5.forEach(e => L.push(`Explication simple « ${e.notion} » : ${e.def} ${e.steps.join(" ")} Exemple : ${e.example} Côté juridique : ${e.legal} En résumé : ${e.summary}`));
      c.cases.forEach(k => L.push(`Cas pratique « ${k.title} » : ${k.facts} Question : ${k.question} Règle : ${k.rule} Application : ${k.app} Conclusion : ${k.concl}`));
      return (TXT[c.id] = L.join("\n"));
    }
    const CATALOGUE = () => J.list.map(c => `[${c.id}] ${label(c)} : ${c.summary}`).join("\n");

    /* ---------- Choix des chapitres pertinents ---------- */
    const STOP = new Set("les des une un est que qui quoi dans pour par sur avec sans aux elle elles ils lui leur leurs ses son sa mon mes ton tes notre vous nous tu je il on ce cette ces cet entre plus moins tres bien fait faire peut peux doit dois quel quelle quels quelles comment pourquoi quand ou donc car mais alors aussi tout tous toute toutes autre autres meme cela ca c'est qu'est explique expliquer explique-moi resume resumer difference definition definir cours chapitre holly jojo stp merci svp question exemple exemples".split(" "));
    const toks = q => [...new Set(J.norm(q).replace(/[^a-z0-9]+/g, " ").split(" ").filter(t => (t.length >= 3 || /\d/.test(t)) && !STOP.has(t)))];
    const NORM = {};
    const normOf = c => NORM[c.id] || (NORM[c.id] = J.norm(chText(c)));
    function rank(q, prev) {
      const T = toks(q), P = prev ? toks(prev) : [];
      return J.list.map(c => {
        const n = normOf(c), title = J.norm(c.title);
        let sc = 0;
        T.forEach(t => { const k = n.split(t).length - 1; sc += Math.min(k, 6) + (title.includes(t) ? 6 : 0); });
        P.forEach(t => { const k = n.split(t).length - 1; sc += Math.min(k, 3) * .4; });
        return { c, sc };
      }).sort((a, b) => b.sc - a.sc);
    }
    function pickChapters(q, prev) {
      if (IA.scope && J.byId[IA.scope]) return [J.byId[IA.scope]];
      const r = rank(q, prev).filter(x => x.sc > 0);
      const out = []; let size = 0; const top = r.length ? r[0].sc : 0;
      for (const x of r) { if (out.length >= 4 || x.sc < top * .25) break; const len = chText(x.c).length; if (size + len > 95000 && out.length) break; out.push(x.c); size += len; }
      return out;
    }

    /* ---------- Outils mis à disposition de Holly ---------- */
    let IDX2;
    function searchCourses(q) {
      if (!IDX2) {
        IDX2 = [];
        J.list.forEach(c => {
          const add = (type, t, x) => IDX2.push({ ch: c.id, type, t, x, n: J.norm(t + " " + x) });
          c.plan.forEach(p => add("Plan du cours", p.h + " (" + p.p + ")", p.pts.join(" ")));
          c.defs.forEach(d => add("Définition", d.t, d.d + " (" + d.p + ")"));
          c.articles.forEach(a => add("Article", a.ref, a.txt));
          c.juris.forEach(j => add("Jurisprudence", `${j.name}, ${j.court}, ${j.date}`, j.solution + " " + j.portee));
          c.authors.forEach(a => add("Auteur", a.n, a.i));
          c.dates.forEach(d => add("Date", d.d, d.e));
          (c.complements || []).forEach(x => add("Complément hors cours", "Complément", x));
        });
      }
      const T = toks(q); if (!T.length) return [];
      return IDX2.map(x => ({ x, s: T.reduce((a, t) => a + (x.n.includes(t) ? 1 : 0), 0) })).filter(r => r.s > 0).sort((a, b) => b.s - a.s).slice(0, 14)
        .map(({ x }) => ({ chapitre: x.ch, titre_chapitre: label(J.byId[x.ch]), type: x.type, intitule: x.t, contenu: x.x.length > 400 ? x.x.slice(0, 400) + "…" : x.x }));

    function makeTools(used, onStep) {
      return [
        { name: "lire_chapitre", description: "Renvoie le contenu complet d'un chapitre du cours (plan détaillé, définitions, articles, jurisprudences, dates, pièges, compléments, cas pratiques). Utilise-le quand le chapitre utile n'est pas déjà dans les extraits fournis.",

          execute(input) { const id = String(input && input.id || "").trim().toLowerCase(); const c = J.byId[id]; if (!c) throw new Error("Chapitre inconnu. Identifiants valides : " + J.list.map(x => x.id).join(", ")); if (!used.includes(id)) used.push(id); onStep(`Holly relit « ${c.title} »…`); return chText(c).slice(0, 30000); } },

          inputSchema: { type: "object", properties: { requete: { type: "string", description: "Quelques mots-clés, ex. « Clément-Bayard » ou « article 1359 »." } }, required: ["requete"] },
          execute(input) { const q = String(input && input.requete || ""); onStep(`Holly cherche « ${q} » dans tes cours…`); const r = searchCourses(q); return r.length ? r : "Aucun passage trouvé pour ces mots-clés."; } }

    /* ---------- Consignes ---------- */
    const RULES = `Tu es Holly, l'intelligence artificielle de Jojo Boss Academy, spécialisée en droit français. Ton personnage : un vieux bichon crème très duveteux, professeur de droit, un peu fatigué mais très fier de son élève. Tu discutes avec Jojo (surnommée « Jojo Boss »), étudiante en première année de licence de droit. Son application contient deux cours : « Droit constitutionnel 1 » (Michel Verpeaux, UNJF, chapitres dc1 à dc9) et « Introduction au droit privé » (Patricia Vannier, chapitres ip1 à ip10).

Ta mission : être l'assistant juridique de Jojo, comme un excellent chargé de TD disponible à toute heure. Tu réponds à toutes ses questions de droit (notions, articles, arrêts, méthodologie de la dissertation, du commentaire d'arrêt, de la fiche d'arrêt et du cas pratique, préparation des partiels, orientation dans les études de droit), et tu l'aides à réviser (explications, plans, quiz, corrections).

Règles :

    /* ---------- Rendu Markdown minimal et sûr ---------- */
    function md(src) {
      const inline = t => esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\[\]]{2,90})\]/g, (m, x) => /p\.|constit|droit|ip\d|dc\d|chap/i.test(x) ? `<span class="ia-src">${x}</span>` : m);
      const out = []; let list = null, para = [];
      const flushP = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
      const flushL = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.t}>`); list = null; } };
      String(src || "").replace(/\r/g, "").split("\n").forEach(line => {
        const l = line.trim();
        let m;
        if (!l) { flushP(); flushL(); return; }
        if ((m = l.match(/^#{1,6}\s+(.*)$/))) { flushP(); flushL(); out.push(`<h4>${inline(m[1])}</h4>`); return; }
        if ((m = l.match(/^[-*•]\s+(.*)$/))) { flushP(); if (!list || list.t !== "ul") { flushL(); list = { t: "ul", items: [] }; } list.items.push(m[1]); return; }
        if ((m = l.match(/^\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== "ol") { flushL(); list = { t: "ol", items: [] }; } list.items.push(m[1]); return; }
        if (list && /^\s{2,}/.test(line)) { list.items[list.items.length - 1] += " " + l; return; }
        flushL(); para.push(l);
      });
      flushP(); flushL();
      return out.join("");
    }

    /* ---------- Vue ---------- */
    const SUGG = [["Explique-moi", "la différence entre déconcentration et décentralisation", "Explique-moi la différence entre déconcentration et décentralisation"], ["Fais-moi", "un mini-quiz sur la QPC", "Fais-moi un mini-quiz de 3 questions sur la QPC, une question à la fois"], ["Aide-moi", "à faire la fiche de l'arrêt Clément-Bayard", "Aide-moi à faire la fiche d'arrêt de Clément-Bayard"], ["Comment", "réussir un cas pratique en droit ?", "Comment réussir un cas pratique en droit ? Donne-moi la méthode"]];
    const IC = {

            : `<h2>On révise quoi, Jojo ?</h2><p>Pose-moi n'importe quelle question de droit. Je m'appuie sur tes cours et je te dis où relire.</p>

          ${has ? `<div class="ia-log" id="ia-log" aria-live="polite">${IA.msgs.map(msgHTML).join("")}</div><div style="flex:1"></div>` : empty}

    };

    /* ---------- Envoi d'une question ---------- */
    const ERR = {
      not_granted: "Tu n'as pas autorisé cette page à interroger Claude. Tu peux le réactiver dans les autorisations de la page, puis reposer ta question.",
      rate_limited: "Holly reprend son souffle (limite gratuite atteinte) : réessaie dans une minute.", queue_overflow: "Holly reprend son souffle : réessaie dans une minute.",

CATALOGUE DES CHAPITRES (identifiant, titre, résumé) :

CONTENU DES COURS — extraits les plus utiles pour la question :
${picked.length ? picked.map(chText).join("\n\n") : "(Aucun chapitre ne correspond directement aux mots de la question. Si elle touche quand même aux cours, appuie-toi sur le catalogue" + (IA.tools ? " et utilise les outils" : "") + " ; sinon, réponds comme juriste selon la règle 2.)"}`;

      const u = C.user;
      return `<div class="card stack"><h3>Compte</h3><div class="row" style="gap:12px">${u.photoURL ? `<img src="${esc(u.photoURL)}" alt="" width="40" height="40" style="border-radius:50%" referrerpolicy="no-referrer">` : ""}<div class="stack" style="gap:2px"><b>${esc(u.displayName || "Connectée")}</b><span class="small muted">${esc(u.email || "")}</span></div></div>
        <p class="small"><span style="color:var(--ok);font-weight:700">●</span> <span id="cloud-state">${stateTxt()}</span></p>
        <p class="small muted">Ta progression est enregistrée sur ton compte Google : connecte-toi avec le même compte sur ton iPhone ou ton Mac pour la retrouver.</p>
        <div class="row"><button class="btn sec sm" data-act="syncnow">Sauvegarder maintenant</button><button class="btn ghost sm" data-act="logout">Se déconnecter</button></div></div>`;
    }
    return `<div class="card stack"><h3>${compact ? "Retrouve ta progression partout" : "Compte"}</h3><p class="small muted">Connecte-toi avec Google pour sauvegarder ta progression en ligne et la retrouver sur l'iPhone, le Mac ou n'importe quel appareil. Sans connexion, elle reste enregistrée seulement sur cet appareil.</p><button class="btn sec" data-act="login" style="align-self:flex-start">${G} Se connecter avec Google</button></div>`;
  }
  const wrap = (name, where) => { const v = VIEWS[name]; if (!v) return; const r = v.render; v.render = function () { const h = r.apply(this, arguments); return where(h); }; };
  wrap("reglages", h => h.replace("</header>", "</header>" + card(false)));
  /* Groupe « Compte » en tête de la feuille Plus */
  ui.sheetGroups.unshift(() => {
    if (!C.ready) return ui.sheetGroup("", [ui.sheetRow({ act: "noop", lead: `<span class="av">${G}</span>`, t: "Compte Google", sub: "Vérification…", end: "" }).replace('class="prow"', 'class="prow pacct"')]);
    if (C.user) {
      const u = C.user;
      const av = u.photoURL ? `<img class="av" src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : `<span class="av">${esc((u.displayName || "?")[0])}</span>`;
      return ui.sheetGroup("", [
        ui.sheetRow({ act: "noop", lead: av, t: esc(u.displayName || "Connectée"), sub: esc(u.email || ""), end: "" }).replace('class="prow"', 'class="prow pacct"'),
        ui.sheetRow({ act: "syncnow", i: "check", t: "Synchronisé", sub: `<span class="cloud-sub">${stateTxt()}</span>`, end: "" }).replace('<span class="tile" style="background:#8E8E93">', '<span class="tile" style="background:#34C759">'),
        ui.sheetRow({ act: "logout", lead: '<span class="tile" style="background:#FF3B30">' + ui.ICON.back + '</span>', t: '<span style="color:#FF3B30">Se déconnecter</span>', end: "" })
      ]);
    }
    return ui.sheetGroup("", [
      ui.sheetRow({ act: "login", lead: `<span class="av">${G.replace(/width="18" height="18"/, 'width="30" height="30"')}</span>`, t: "Se connecter avec Google", sub: "Synchronise ta progression", end: "" }).replace('class="prow"', 'class="prow pacct pgoogle"')
    ]);
  });
  ACT.noop = () => {};
  const origRerender = ui.rerender;
  ui.rerender = () => { origRerender(); ui.refreshSheet && ui.refreshSheet(); };
  ui.rerender();
})();

</script>
<script>window.JBA_BUILD="20261103-211800";
/* Mise à jour automatique : compare la version embarquée à version.json et recharge si une nouvelle version est en ligne. */
(function () {
  const B = window.JBA_BUILD; if (!B || !window.fetch) return;
  let busy = false;
  const check = async () => {
    if (busy) return; busy = true;
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      const v = (await r.json()).build;
      let last = null; try { last = sessionStorage.getItem("jba-reload"); } catch (e) { }
      if (v && v !== B && last !== v) {
        try { sessionStorage.setItem("jba-reload", v); } catch (e) { }
        location.replace(location.pathname + "?v=" + v + location.hash);
      }
    } catch (e) { }
    busy = false;
  };
  check();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
  const ui = window.JBA && window.JBA.ui, V = ui && ui.VIEWS && ui.VIEWS.reglages;
  if (V) { const r = V.render; V.render = function () { return r.apply(this, arguments).replace("Raccourci clavier", `Version ${B}. Raccourci clavier`); }; }
})();

</script>
