<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jojo Boss"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-512.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>Jojo Boss Academy</title>
<meta name="theme-color" content="#F5F5F7">
<style>
/* Layout : rail latéral sur ordinateur, barre d'onglets en bas sur mobile ; contenu centré en colonne de lecture. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface2:#F2F2F5; --surface3:#E8E8ED;
  --ink:#1D1D1F; --ink2:#6E6E73; --line:rgba(0,0,0,.09);
  --rose:#F3C6D2; --rose2:#FCEEF2; --framboise:#D2335F; --framboise2:#B0244C;
  --sauge:#8FAE8C; --sauge2:#EAF4EA; --turq:#0A84A8; --turq2:#E6F4F8; --beige:#E8D4BC; --gold:#C98A0B; --gold2:#FFF4DC;
  --ok:#248A3D; --ok2:#E7F6EA; --ko:#D70015; --ko2:#FDECEC;
  --shadow:0 1px 1px rgba(0,0,0,.03),0 4px 18px rgba(0,0,0,.06);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-hand:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --r:20px; --r-s:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --surface3:#3A3A3C;
  --ink:#F5F5F7; --ink2:#98989D; --line:rgba(255,255,255,.1);
  --rose:#5A2A3A; --rose2:#2E1A21; --framboise:#FF6B8E; --framboise2:#FF8FA9;
  --sauge:#A7C4A3; --sauge2:#1E2A1F; --turq:#64D2FF; --turq2:#0F2630; --beige:#5A4A3C; --gold:#FFD60A; --gold2:#2E2810;
  --ok:#30D158; --ok2:#132A19; --ko:#FF453A; --ko2:#331513;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --surface3:#3A3A3C;
  --ink:#F5F5F7; --ink2:#98989D; --line:rgba(255,255,255,.1);
  --rose:#5A2A3A; --rose2:#2E1A21; --framboise:#FF6B8E; --framboise2:#FF8FA9;
  --sauge:#A7C4A3; --sauge2:#1E2A1F; --turq:#64D2FF; --turq2:#0F2630; --beige:#5A4A3C; --gold:#FFD60A; --gold2:#2E2810;
  --ok:#30D158; --ok2:#132A19; --ko:#FF453A; --ko2:#331513;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.005em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,50px);line-height:1.05}
h2{font-size:clamp(23px,3.6vw,30px);line-height:1.15}
h3{font-size:calc(20px*var(--ts,1));line-height:1.25}
p{margin:0}
a{color:var(--framboise)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px;border-radius:8px}
.hand{font-family:var(--f-hand);font-size:1.35em;line-height:1.15}
.eyebrow{font-size:calc(12px*var(--ts,1));font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink2)}
.small{font-size:calc(14px*var(--ts,1))}
.tnum{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand .mini{width:40px;height:40px;flex:none;border-radius:50%;background:var(--rose2);overflow:hidden;display:grid;place-items:center}
.brand .mini svg{width:46px;height:46px;margin-top:6px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:calc(19px*var(--ts,1));line-height:1;white-space:nowrap}
.brand small{display:block;font-size:calc(11px*var(--ts,1));color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.top .grow{flex:1}
.brand>span:last-child{min-width:0;overflow:hidden}
@media (max-width:440px){.top .brand>span:last-child{display:none}}
.side .holly-say{grid-template-columns:56px 1fr}.side .holly-say .bubble{font-size:calc(17px*var(--ts,1))}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--rose)}
.iconbtn svg{width:20px;height:20px}
.xpchip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:calc(13px*var(--ts,1));font-weight:700;cursor:pointer;white-space:nowrap}
.xpchip .lv{background:var(--framboise);color:#fff;border-radius:999px;padding:2px 8px;font-size:calc(12px*var(--ts,1))}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 110px;min-width:0}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.read{max-width:760px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:calc(11.5px*var(--ts,1));font-weight:600;color:var(--ink2);text-decoration:none;background:none;border:0;cursor:pointer}
.tabbar svg{width:23px;height:23px}
.tabbar .on{color:var(--framboise)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:calc(15px*var(--ts,1))}
.nav a svg{width:20px;height:20px;color:var(--ink2);flex:none}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--rose2);color:var(--framboise2)}
.nav a.on svg{color:var(--framboise)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
@media (min-width:960px){
  .app{grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px}
  .tabbar{display:none}
  .top .brand{display:none}
  main{padding-block:28px 60px}
}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(40,20,30,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet .nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.tint-rose{background:var(--rose2);border-color:transparent}
.tint-sauge{background:var(--sauge2);border-color:transparent}
.tint-turq{background:var(--turq2);border-color:transparent}
.tint-gold{background:var(--gold2);border-color:transparent}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:700;font-size:calc(15px*var(--ts,1));border:1.5px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;min-height:46px}
.btn.pri{background:var(--framboise);color:#fff}
.btn.pri:hover{background:var(--framboise2)}
.btn.sec{background:var(--surface);border-color:var(--rose);color:var(--ink)}
.btn.sec:hover{background:var(--rose2)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.turq{background:var(--turq);color:#fff}
.btn.sm{padding:8px 14px;font-size:calc(14px*var(--ts,1));min-height:38px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:calc(12.5px*var(--ts,1));font-weight:700;white-space:nowrap}
.pill.decouvrir{background:var(--surface3);color:var(--ink2)}
.pill.encours{background:var(--turq2);color:var(--turq)}
.pill.revoir{background:var(--gold2);color:var(--gold)}
.pill.maitrisee{background:var(--ok2);color:var(--ok)}
.pill.fav{background:var(--rose2);color:var(--framboise)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:calc(14px*var(--ts,1));cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:calc(14px*var(--ts,1));cursor:pointer}
.chip.on{border-color:var(--framboise);background:var(--rose2);color:var(--framboise2)}
.bar{height:10px;border-radius:999px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--framboise),#E7739A);border-radius:inherit;transition:width .6s ease}
.bar.turq>i{background:linear-gradient(90deg,var(--turq),#7ED3CD)}
.bar.sauge>i{background:var(--sauge)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:calc(28px*var(--ts,1));font-family:var(--f-display);font-weight:400;line-height:1.1}
.stat span{font-size:calc(13px*var(--ts,1));color:var(--ink2)}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:calc(16px*var(--ts,1))}
.input:focus{border-color:var(--turq);outline:none}
textarea.input{min-height:180px;resize:vertical;line-height:1.55}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{flex:none;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:700;font-size:calc(14.5px*var(--ts,1));color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg)}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.list li::marker{color:var(--framboise)}
.dl{display:grid;gap:10px}
.dl>div{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:6px 16px;padding:12px 0;border-top:1px solid var(--line)}
.dl>div:first-child{border-top:0}
.dl dt{font-weight:700}
.dl dd{margin:0;min-width:0}
@media (max-width:620px){.dl>div{grid-template-columns:1fr}}
.ref{font-size:calc(12.5px*var(--ts,1));color:var(--ink2);white-space:nowrap}
.note{border-left:4px solid var(--gold);background:var(--gold2);padding:12px 14px;border-radius:0 12px 12px 0;font-size:calc(14.5px*var(--ts,1))}
.note.turq{border-color:var(--turq);background:var(--turq2)}
.empty{text-align:center;padding:26px;color:var(--ink2)}

/* Holly */
.holly-svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:relative;background:var(--surface);border:1.5px solid var(--rose);border-radius:20px;padding:14px 16px;font-family:var(--f-hand);font-size:calc(23px*var(--ts,1));line-height:1.18;color:var(--ink)}
.holly-say{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.holly-say .who{font-family:var(--f-ui);font-size:calc(12px*var(--ts,1));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--framboise);display:block;margin-bottom:2px}
.holly-say.sm{grid-template-columns:72px 1fr}
.holly-say.sm .bubble{font-size:calc(20px*var(--ts,1));padding:10px 14px}
.bob{animation:bob 4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-4px) rotate(1deg)}}
.breathe{animation:breathe 5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.025,0.985)}}
body.focus .deco,body.focus .holly-say:not(.keep),body.focus .love{display:none!important}

/* Hero */
.hero{display:grid;grid-template-columns:1.25fr .9fr;gap:20px;align-items:center;background:linear-gradient(160deg,var(--rose2),var(--surface2));border-radius:28px;padding:clamp(20px,4vw,40px);position:relative;overflow:hidden}
.hero .art{position:relative;max-width:330px;justify-self:center;width:100%}
.hero .motifs{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-around;opacity:.95;pointer-events:none}
.hero .slogan{font-family:var(--f-hand);font-size:clamp(22px,3.2vw,28px);color:var(--framboise2);line-height:1.15}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .art{max-width:230px;grid-row:1}}
.motif-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Library */
.chcard{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;width:100%}
.chcard:hover{transform:translateY(-2px);border-color:var(--rose)}
.chcard .num{font-family:var(--f-display);font-size:calc(30px*var(--ts,1));line-height:1;color:var(--framboise)}
.chcard h3{font-size:calc(18.5px*var(--ts,1))}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--framboise) calc(var(--p)*1%),var(--surface3) 0);display:grid;place-items:center;flex:none}
.ring>span{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:calc(11.5px*var(--ts,1));font-weight:800}
.subjhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.subjhead .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--turq2);color:var(--turq)}
.subjhead .ic svg{width:30px;height:30px}

/* Quiz */
.q-opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--surface);text-align:left;width:100%;font-size:calc(16px*var(--ts,1))}
.q-opt:hover{border-color:var(--rose)}
.q-opt .box{width:22px;height:22px;flex:none;border:2px solid var(--ink2);border-radius:50%;margin-top:1px;display:grid;place-items:center}
.q-opt.multi .box{border-radius:6px}
.q-opt.sel{border-color:var(--framboise);background:var(--rose2)}
.q-opt.sel .box{border-color:var(--framboise);background:var(--framboise)}
.q-opt.sel .box::after{content:"";width:8px;height:8px;background:#fff;border-radius:inherit}
.q-opt.good{border-color:var(--ok);background:var(--ok2)}
.q-opt.bad{border-color:var(--ko);background:var(--ko2)}
.q-opt[disabled]{cursor:default}
.diff{display:inline-flex;align-items:center;gap:6px;font-size:calc(13px*var(--ts,1));font-weight:700}
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok2)}
.fb.ko{background:var(--ko2)}
.level-card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;background:var(--surface);text-align:left}
.level-card.on{border-color:var(--framboise);background:var(--rose2)}

/* Flashcards */
.flip{perspective:1400px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:left}
.flip .inner{position:relative;min-height:280px;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);overflow:auto}
.flip .back{transform:rotateY(180deg);background:var(--turq2)}
.flip .face .k{position:absolute;top:16px;left:20px}
.flip .face .t{font-family:var(--f-display);font-size:clamp(20px,3vw,26px);line-height:1.25}
.flip .back .t{font-family:var(--f-ui);font-size:calc(18px*var(--ts,1));font-weight:500}
@media (prefers-reduced-motion:reduce){.flip .inner,.bar>i{transition:none}.bob,.breathe{animation:none}}

/* Travel */
.map{width:100%;height:auto;display:block;border-radius:20px;background:var(--turq2)}
.map .land{fill:var(--surface);stroke:var(--line);stroke-width:.8}
.pin{cursor:pointer}
.pin circle.halo{fill:var(--framboise);opacity:.18}
.pin.locked circle{fill:var(--ink2)}
.pin text{font:700 15px var(--f-ui);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.scene{border-radius:18px;overflow:hidden;line-height:0}
.scene svg{width:100%;height:auto;display:block;aspect-ratio:400/220}
.stamp{border:2px dashed var(--framboise);border-radius:12px;padding:6px 10px;color:var(--framboise);font-weight:800;font-size:calc(12px*var(--ts,1));letter-spacing:.08em;text-transform:uppercase;transform:rotate(-4deg);display:inline-block}

/* Love box */
.env{position:relative;border-radius:18px;padding:18px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;cursor:pointer;border:1.5px solid var(--rose);background:var(--surface);text-align:left;width:100%}
.env.locked{cursor:default;border-style:dashed;background:var(--surface2);color:var(--ink2)}
.env.open{background:linear-gradient(150deg,var(--rose2),var(--surface))}
.env .msg{font-family:var(--f-hand);font-size:calc(24px*var(--ts,1));line-height:1.2;color:var(--ink)}

/* Overlays */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:calc(14.5px*var(--ts,1));box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (min-width:960px){.toast{bottom:28px}}
.celebrate{position:fixed;inset:0;z-index:95;background:rgba(40,20,30,.45);display:grid;place-items:center;padding:16px}
.celebrate .card{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.celebrate .holly-wrap{width:190px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:96}
.search-ov{position:fixed;inset:0;z-index:80;background:rgba(40,20,30,.35);display:flex;justify-content:center;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px))}
.search-ov>div{background:var(--surface);width:100%;max-width:720px;border-radius:22px;padding:16px;max-height:85vh;display:flex;flex-direction:column;gap:12px}
.search-ov .res{overflow:auto;display:flex;flex-direction:column;gap:6px}
.res-item{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.res-item:hover,.res-item:focus{background:var(--surface2)}
.res-item mark{background:var(--gold2);color:inherit;border-radius:3px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--surface2)}
.timer.warn{background:var(--ko2);color:var(--ko)}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hist{list-style:none;margin:0;padding:0}
.hist li:first-child{border-top:0}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 10px;border-radius:16px;background:var(--surface2)}
.badge .medal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--gold2);border:2px solid var(--gold)}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge b{font-size:calc(14px*var(--ts,1));line-height:1.2}
table.tbl{width:100%;border-collapse:collapse;font-size:calc(14.5px*var(--ts,1))}
.tbl th,.tbl td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-size:calc(12px*var(--ts,1));letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border-top:0}
.scroll-x{overflow-x:auto}
.eli{border:1.5px dashed var(--turq);border-radius:18px;padding:16px;background:var(--turq2);display:flex;flex-direction:column;gap:10px}
.eli h4{margin:0;font-size:calc(14px*var(--ts,1));letter-spacing:.06em;text-transform:uppercase;color:var(--turq)}
.holly-btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--turq);background:var(--surface);color:var(--turq);border-radius:999px;padding:9px 16px;font-weight:800;font-size:calc(14px*var(--ts,1));cursor:pointer;letter-spacing:.02em}
.holly-btn:hover{background:var(--turq2)}
.secnum{font-family:var(--f-display);color:var(--framboise);font-size:calc(22px*var(--ts,1));line-height:1}
.fiche-sec{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:18px 0;border-top:1px solid var(--line)}
.fiche-sec:first-child{border-top:0}
.juris{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.juris .dl>div{grid-template-columns:minmax(0,140px) 1fr;padding:6px 0}
.kbd{font-size:calc(12px*var(--ts,1));border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--ink2)}

/* ===== Style Apple ===== */
body{font-size:calc(17px*var(--ts,1));line-height:1.47;letter-spacing:-.012em;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,.disp{font-weight:700;letter-spacing:-.025em}
h1{font-size:clamp(32px,6vw,52px);line-height:1.06}
h2{font-size:clamp(22px,3.4vw,28px);letter-spacing:-.02em}
h3{font-size:calc(19px*var(--ts,1));font-weight:600;letter-spacing:-.015em}
.eyebrow{letter-spacing:.02em;text-transform:none;font-size:calc(13px*var(--ts,1));font-weight:600;color:var(--framboise)}
.hand{font-style:italic;font-size:1.15em}
.top{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.brand b{font-weight:700;font-size:calc(18px*var(--ts,1));letter-spacing:-.02em}
.brand small{letter-spacing:.02em;text-transform:none;font-size:calc(12px*var(--ts,1))}
.iconbtn{border:0;background:var(--surface3);border-radius:50%;width:36px;height:36px}
.iconbtn:hover{background:var(--line)}
.iconbtn svg{width:18px;height:18px}
.xpchip{border:0;background:var(--surface3)}
.tabbar{background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.tabbar a,.tabbar button{font-size:calc(10.5px*var(--ts,1));font-weight:500}
@media (min-width:960px){.side{background:color-mix(in srgb,var(--surface2) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-right:.5px solid var(--line);padding:22px 12px}}
.nav a{border-radius:8px;padding:7px 10px;font-weight:500;font-size:calc(14px*var(--ts,1))}
.nav a svg{color:var(--framboise)}
.nav a.on{background:var(--framboise);color:#fff}
.nav a.on svg{color:#fff}
.nav a:hover:not(.on){background:var(--surface3)}
.card{border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card.flat{background:var(--surface2);box-shadow:none}
:root[data-theme="dark"] .card.flat{background:var(--surface)}
.btn{font-weight:600;font-size:calc(16px*var(--ts,1));border:0;min-height:44px;padding:11px 22px;letter-spacing:-.01em;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri:hover{background:var(--framboise);filter:brightness(1.07)}
.btn.sec{background:var(--surface3);color:var(--ink)}
.btn.sec:hover{background:var(--surface3);filter:brightness(.97)}
.btn.ghost{background:transparent;color:var(--framboise);border:0}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{font-size:calc(14px*var(--ts,1));min-height:34px;padding:7px 14px}
.pill{font-weight:600;font-size:calc(12px*var(--ts,1));padding:3px 9px}
.seg{background:var(--surface3);border-radius:10px;padding:2px}
.seg button{border-radius:8px;padding:6px 14px;font-weight:500;font-size:calc(14px*var(--ts,1));color:var(--ink)}
.seg button.on{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button.on{background:#636366}
.chip{border:0;background:var(--surface3);font-weight:500}
.chip.on{background:var(--framboise);color:#fff}
.bar{height:6px;background:var(--surface3)}
.bar>i{background:var(--framboise)}
.bar.turq>i{background:var(--turq)}
.stat b{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em}
.input{border:0;background:var(--surface2);border-radius:12px;box-shadow:inset 0 0 0 .5px var(--line)}
.input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--framboise) 35%,transparent)}
.tabs{background:var(--surface3);border-radius:10px;padding:2px;gap:2px;align-self:flex-start;max-width:100%}
.tabs button{border-radius:8px;padding:6px 14px;font-weight:500;color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .tabs button.on{background:#636366}
.note{border-left:0;border-radius:14px}
.bubble{border:0;background:var(--surface2);border-radius:18px 18px 18px 6px;font-size:calc(19px*var(--ts,1));line-height:1.3;font-style:italic}
.card .bubble,.tint-rose .bubble{background:var(--surface)}
.holly-say .who{letter-spacing:.02em;text-transform:none;font-style:normal;font-size:calc(12px*var(--ts,1))}
.holly-say.sm .bubble{font-size:calc(17px*var(--ts,1))}
.hero{background:linear-gradient(180deg,var(--rose2),var(--surface));box-shadow:var(--shadow);border-radius:28px}
.hero .slogan{font-style:italic;font-size:clamp(20px,2.8vw,25px)}
.chcard{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.chcard:hover{transform:translateY(-3px) scale(1.005);box-shadow:0 10px 30px rgba(0,0,0,.1)}
.chcard .num{font-family:var(--f-display);font-weight:700;letter-spacing:-.03em}
.q-opt{border:0;background:var(--surface2);border-radius:14px;box-shadow:inset 0 0 0 1px transparent}
.q-opt:hover{background:var(--surface3)}
.q-opt.sel{background:var(--rose2);box-shadow:inset 0 0 0 2px var(--framboise)}
.q-opt.good{background:var(--ok2);box-shadow:inset 0 0 0 2px var(--ok)}
.q-opt.bad{background:var(--ko2);box-shadow:inset 0 0 0 2px var(--ko)}
.level-card{border:0;background:var(--surface2)}
.level-card.on{background:var(--rose2);box-shadow:inset 0 0 0 2px var(--framboise)}
.flip .face{border:0;border-radius:26px}
.flip .face .t{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em}
.env{border:0;box-shadow:var(--shadow);border-radius:20px}
.env.locked{border:0;box-shadow:none}
.env .msg{font-style:italic;font-size:calc(21px*var(--ts,1))}
.sheet,.search-ov,.celebrate{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet>div{border-radius:14px 14px 0 0}
.search-ov>div{border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.celebrate .card{border-radius:22px}
.toast{background:color-mix(in srgb,var(--ink) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-weight:600}
.stamp{font-weight:700;letter-spacing:.04em}
.eli{border:0;border-radius:18px}
.holly-btn{border:0;background:var(--turq2);font-weight:600;letter-spacing:0}
.secnum{font-family:var(--f-display);font-weight:700}
.tbl th{letter-spacing:.01em;text-transform:none;font-size:calc(13px*var(--ts,1));font-weight:600}
.juris{border:0}
.badge{background:var(--surface2)}
.btn.pri,.btn.pri:hover{background:#D2335F;color:#fff}
.nav a.on{background:#D2335F}
.chip.on{background:#D2335F}
.xpchip .lv{background:#D2335F}

/* ===== Apple, deuxième passe ===== */
body{font-size:calc(17px*var(--ts,1))}
main{padding-block:34px 120px}
.wrap{gap:28px}
h1{font-weight:700;letter-spacing:-.035em;line-height:1.04}
h2{font-weight:700;letter-spacing:-.028em}
.muted{color:var(--ink2)}
.tint-rose,.tint-gold,.tint-sauge{background:var(--surface)}
.tint-turq{background:var(--surface)}
.hero{background:var(--surface);box-shadow:var(--shadow)}
.hero.home{grid-template-columns:1fr;justify-items:center;text-align:center;padding:clamp(36px,7vw,72px) clamp(20px,5vw,56px) 0;gap:28px;background:linear-gradient(180deg,var(--surface) 55%,var(--rose2))}
.hero.home .stack{align-items:center}
.hero.home h1{font-size:clamp(40px,7.4vw,76px)}
.hero.home p{margin-inline:auto;color:var(--ink2);font-size:clamp(18px,2.2vw,21px)!important}
.hero.home .art{grid-row:auto;max-width:300px;margin-bottom:-6px}
.hero.home .row{justify-content:center;gap:22px}
.hero .slogan,.hero.home p.slogan{font-family:var(--f-ui);font-style:normal;font-weight:700;letter-spacing:-.02em;font-size:clamp(20px,2.6vw,26px)!important;background:linear-gradient(90deg,#E0406E,#B04CC8 55%,#3A7BEA);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.btn.link{background:none;color:var(--framboise);padding-inline:4px;min-height:auto;font-weight:500}
.btn.link:hover{text-decoration:underline;filter:none}
.bubble,.holly-say.sm .bubble{font-family:var(--f-ui);font-style:normal;font-size:calc(16.5px*var(--ts,1));line-height:1.4;font-weight:450}
.hand{font-family:var(--f-ui);font-style:normal;font-weight:600;letter-spacing:-.02em;font-size:1.05em}
.env .msg{font-family:var(--f-ui);font-style:normal}
.eyebrow{font-weight:600;font-size:calc(14px*var(--ts,1));letter-spacing:-.005em}
.card{padding:24px}
.nav{gap:1px;display:flex;flex-direction:column}
.nav a{padding:6px 10px;font-size:calc(13.5px*var(--ts,1))}
.nav a svg{width:17px;height:17px}
.nav a.on{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.nav a.on svg{color:var(--framboise)}
@media (min-width:960px){.app{grid-template-columns:230px 1fr}}
.top{border-bottom:.5px solid var(--line)}
.stat b{font-size:calc(34px*var(--ts,1))}
.note{background:var(--surface2)}
.note.turq{background:var(--surface2)}
.chcard{padding:22px}
.pill.fav{background:var(--surface3);color:var(--ink)}
@media (max-width:600px){.br-d{display:none}.hero.home h1{font-size:calc(40px*var(--ts,1))}}

/* ===== Feuille « Plus » façon iOS ===== */
.sheet{align-items:flex-end;animation:fadein .2s ease}
.psheet{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:6px;animation:sheetup .32s cubic-bezier(.2,.9,.3,1)}
@media (min-width:600px){.sheet{align-items:center}.psheet{border-radius:16px;max-height:86vh;box-shadow:0 30px 80px rgba(0,0,0,.3)}}
@keyframes sheetup{from{transform:translateY(40px);opacity:.4}}
@keyframes fadein{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.psheet,.sheet{animation:none}}
.psheet .grab{width:36px;height:5px;border-radius:3px;background:var(--surface3);align-self:center;margin:2px 0 8px}
.pclose{width:30px;height:30px;border-radius:50%;border:0;background:var(--surface3);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.pclose svg{width:14px;height:14px;stroke-width:2.6}
.plabel{font-size:calc(13px*var(--ts,1));color:var(--ink2);text-transform:uppercase;letter-spacing:.02em;margin:14px 16px 6px}
.pgroup{background:var(--surface);border-radius:12px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:0 14px 0 14px;min-height:50px;background:none;border:0;text-align:left;color:var(--ink);text-decoration:none;cursor:pointer;font-size:calc(17px*var(--ts,1));position:relative}
.prow:active{background:var(--surface3)}
@media (hover:hover){.prow:hover{background:var(--surface2)}}
.prow+.prow::before{content:"";position:absolute;top:0;right:0;left:56px;border-top:.5px solid var(--line)}
.prow .tile{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.prow .tile svg{width:18px;height:18px;stroke-width:2.1}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 0}
.pt{font-weight:400;letter-spacing:-.01em}
.ps{font-size:calc(13px*var(--ts,1));color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchev{color:var(--ink2);opacity:.55;display:grid}
.pchev svg{width:16px;height:16px;stroke-width:2.4}
.ptoggle{width:51px;height:31px;border-radius:999px;background:var(--surface3);position:relative;flex:none;transition:background .2s}
.ptoggle i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.ptoggle.on{background:#34C759}
.ptoggle.on i{transform:translateX(20px)}
.pacct{min-height:76px}
.pacct .av{width:56px;height:56px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface3);display:grid;place-items:center;overflow:hidden}
.pacct .pt{font-size:calc(19px*var(--ts,1));font-weight:600}
.prow.pgoogle .pt{color:#007AFF}
:root[data-theme="dark"] .prow.pgoogle .pt{color:#0A84FF}
.pnote{font-size:calc(13px*var(--ts,1));color:var(--ink2);margin:6px 16px 0;line-height:1.35}
.desk-only{display:none}@media (min-width:960px){.desk-only{display:grid}}
.psheet>*{flex-shrink:0}
.sheet>.psheet{--grp:#F2F2F7;--cell:#FFFFFF;background:var(--grp);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0}@media (min-width:600px){.sheet>.psheet{border-radius:16px}}
.pgroup{background:var(--cell)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .psheet{--grp:#000;--cell:#1C1C1E}}
:root[data-theme="dark"] .psheet{--grp:#000;--cell:#1C1C1E}
:root[data-theme="dark"] .pclose,:root[data-theme="dark"] .ptoggle{background:#39393D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pclose,:root:not([data-theme="light"]) .ptoggle{background:#39393D}}
.ptoggle.on{background:#34C759!important}
@media (min-width:600px){.psheet .grab{display:none}}

/* ===== Animations douces ===== */
:root{--ease:cubic-bezier(.22,.8,.25,1);--spring:cubic-bezier(.34,1.4,.5,1)}
html{scroll-behavior:smooth}
.wrap.enter>*{animation:rise .42s var(--ease) both}
.wrap.enter>*:nth-child(2){animation-delay:.04s}.wrap.enter>*:nth-child(3){animation-delay:.08s}.wrap.enter>*:nth-child(4){animation-delay:.12s}.wrap.enter>*:nth-child(n+5){animation-delay:.15s}
.wrap.swap .card,.wrap.swap .flip{animation:swapin .34s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes swapin{from{opacity:0;transform:translateX(14px)}}
.btn,.chip,.q-opt,.level-card,.prow,.iconbtn,.seg button,.tabs button,.chcard,.env,.tabbar a,.tabbar button,.nav a{transition:transform .18s var(--ease),background-color .2s,box-shadow .2s,color .2s,opacity .2s,filter .2s}
.btn:active,.chip:active,.iconbtn:active,.level-card:active,.chcard:active,.seg button:active{transform:scale(.96)}
.q-opt:active:not([disabled]){transform:scale(.985)}
.tabbar a:active svg,.tabbar button:active svg{transform:scale(.88)}
.tabbar svg{transition:transform .18s var(--spring)}
.tabbar .on svg{animation:tabpop .35s var(--spring)}
@keyframes tabpop{40%{transform:scale(1.14)}}
.q-opt.good{animation:pop .4s var(--spring)}
.q-opt.bad{animation:nudge .38s var(--ease)}
@keyframes pop{45%{transform:scale(1.02)}}
@keyframes nudge{20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
.fb{animation:rise .32s var(--ease) both}
.q-opt .box{transition:background-color .18s,border-color .18s,transform .2s var(--spring)}
.q-opt.sel .box{transform:scale(1.08)}
.flip .inner{transition:transform .6s var(--spring)}
.bar>i{transition:width .7s var(--ease)}
.toast{opacity:0;transform:translate(-50%,12px) scale(.97);transition:opacity .25s var(--ease),transform .3s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.celebrate{animation:fadein .2s ease}
.celebrate .card{animation:popin .45s var(--spring)}
@keyframes popin{from{opacity:0;transform:scale(.92) translateY(8px)}}
.search-ov{animation:fadein .18s ease}.search-ov>div{animation:popin .3s var(--ease)}
.ptoggle,.ptoggle i{transition:background-color .25s,transform .3s var(--spring)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== Écrans simplifiés ===== */
.pgroup{background:var(--cell,var(--surface));border-radius:12px;overflow:hidden}
.wrap .pgroup{box-shadow:var(--shadow)}
.wrap .plabel{margin:4px 16px 8px}
.pcount{color:var(--ink2);font-size:calc(15px*var(--ts,1));margin-right:2px}
.seg.wide{display:flex;width:100%;border-radius:9px}
.seg.wide button{flex:1;padding:7px 6px;text-align:center}
.btn.block{width:100%}
.grings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.gring{display:flex;flex-direction:column;align-items:center;gap:2px}
.gring svg{width:72px;height:72px}
.gring svg circle:last-child{transition:stroke-dashoffset .9s var(--ease)}
.gring b{font-size:calc(15px*var(--ts,1));margin-top:4px}
.gring span{font-size:calc(12px*var(--ts,1));color:var(--ink2)}
.hero.home h1{font-size:clamp(36px,6.6vw,68px)}
.hero.home .art{max-width:230px}
.searchfield{display:flex;align-items:center;gap:8px;background:var(--surface3);border-radius:10px;padding:0 10px;height:38px;color:var(--ink2)}
.searchfield svg{width:17px;height:17px;flex:none}
.searchfield input{border:0;background:none;outline:none;flex:1;font-size:calc(17px*var(--ts,1));color:var(--ink);min-width:0}

/* ===== Flashcard qui se retourne ===== */

.ia-typing{display:inline-flex;gap:5px;padding:4px 0}.ia-typing i{width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:iadot 1.2s infinite}.ia-typing i:nth-child(2){animation-delay:.2s}.ia-typing i:nth-child(3){animation-delay:.4s}

.swrow{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer}

.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--surface3);position:relative;flex:none;cursor:pointer;transition:background-color .25s;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .3s var(--spring)}

:root[data-theme="dark"] .sw:not(:checked){background:#39393D}
.pdetails summary .muted{white-space:nowrap;padding-left:10px}

/* ===== Holly IA : fluidité ===== */

/* Révisions : revoir dans le cours, programme, oral */
.plabel-row{align-items:flex-end;flex-wrap:nowrap;gap:0}
.plabel-row .plabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plabel-row .btn.link{margin:0 12px 8px;font-size:calc(15px*var(--ts,1))}
.revoir{border-top:.5px solid var(--line);padding-top:8px}
.revoir summary{cursor:pointer;font-weight:600;color:var(--framboise);list-style:none;font-size:calc(15px*var(--ts,1))}
.revoir summary::-webkit-details-marker{display:none}
.revoir summary::after{content:" ›";display:inline-block;transition:transform .2s var(--ease)}
.revoir[open] summary::after{transform:rotate(90deg)}
.or-md p{margin:0 0 6px}
#or-ans{min-height:110px;font-size:calc(17px*var(--ts,1))}
#or-mic[aria-pressed="true"]{background:var(--ko2);color:var(--ko)}

/* Oral avec Holly */
.or-start{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
.or-page{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 190px)}
.or-stage{display:flex;flex-direction:column;gap:14px;flex:1}
.or-holly{width:150px;align-self:center;position:relative;transition:transform .3s var(--ease)}
.or-holly.listening{transform:scale(.92)}
.or-holly::after{content:"";position:absolute;inset:8% 4%;border-radius:50%;box-shadow:0 0 0 0 rgba(255,45,85,.35);pointer-events:none}
.or-holly.listening::after{animation:orpulse 1.6s infinite}
@keyframes orpulse{0%{box-shadow:0 0 0 0 rgba(255,45,85,.35)}100%{box-shadow:0 0 0 26px rgba(255,45,85,0)}}
.or-score{display:flex;justify-content:center;gap:14px;font-size:calc(13px*var(--ts,1));color:var(--ink2)}
.or-score span:first-child{color:var(--ok);font-weight:600}
.or-log{display:flex;flex-direction:column;gap:8px;max-height:38dvh;overflow-y:auto;padding:2px}
.or-b{max-width:86%;padding:10px 14px;border-radius:20px;font-size:calc(16px*var(--ts,1));line-height:1.4}
.or-b.new{animation:rise .28s var(--ease) both}
.or-b.holly{background:var(--surface);align-self:flex-start;border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.or-b.holly.v-juste{background:var(--ok2,#E3F6E8)}
.or-b.holly.v-faux{background:var(--ko2)}
.or-b.me{background:var(--framboise);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.or-b.me.live{opacity:.75;min-width:40px}
.or-b.me.live:empty::before{content:"…"}
.or-ctl{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:auto}
.or-mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--framboise);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(210,51,95,.3);transition:transform .2s var(--ease),background .2s}
.or-mic svg{width:32px;height:32px}
.or-mic:active{transform:scale(.94)}
.or-mic.listening{background:#FF3B30;animation:orpulse 1.6s infinite}
.or-mic.speaking,.or-mic.thinking{background:var(--surface3);color:var(--ink);box-shadow:none}
.or-mic .ia-typing i{background:var(--ink2)}
@media (prefers-reduced-motion:reduce){.or-holly.listening::after,.or-mic.listening{animation:none}}

/* Oral en direct */
.or-page.lv{align-items:stretch;gap:12px}
.lv-q{text-align:center;margin-top:2px}
.lv-holly{--lv:0;position:relative;width:min(56vw,230px);aspect-ratio:1;align-self:center;display:grid;place-items:center;margin:6px 0 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lv-face{width:78%;position:relative;z-index:2;transform:scale(calc(1 + var(--lv) * .06));transition:transform .08s linear}
.lv-ring{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(255,45,85,.16),rgba(255,45,85,0) 70%);transform:scale(calc(.92 + var(--lv) * .35));transition:transform .09s linear,opacity .3s;opacity:.9}
.lv-ring.r2{inset:0;background:none;border:2px solid rgba(255,45,85,.22);transform:scale(calc(.9 + var(--lv) * .5));opacity:calc(.25 + var(--lv) * .75)}
.lv-holly[data-st="listening"] .lv-ring{background:radial-gradient(circle,rgba(52,199,89,.18),rgba(52,199,89,0) 70%)}
.lv-holly[data-st="listening"] .lv-ring.r2{border-color:rgba(52,199,89,.35)}
.lv-holly[data-st="connecting"] .lv-ring.r2,.lv-holly[data-st="thinking"] .lv-ring.r2{animation:orpulse 1.4s infinite;border-color:rgba(142,142,147,.35)}
.lv-st{text-align:center;font-weight:600;font-size:calc(17px*var(--ts,1));min-height:24px;margin:0}
.lv-log{max-height:30dvh;min-height:90px}
.lv-ctl{display:flex;justify-content:center;gap:28px;margin-top:auto}
.lv-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font-size:calc(13px*var(--ts,1));cursor:pointer}
.lv-btn svg{width:62px;height:62px;padding:17px;border-radius:50%;background:var(--surface3);box-sizing:border-box;transition:background .2s,transform .15s var(--ease)}
.lv-btn:active svg{transform:scale(.93)}
.lv-btn.off svg{background:var(--ink);color:var(--bg)}
.lv-btn.end svg{background:#FF3B30;color:#fff}

(function () {

  function fluff(cx, cy, r, n, b, fill, stroke, rot = 0) {
    let s = "";

      const a = rot + (i / n) * Math.PI * 2;

        rows.push(`<button type="button" class="prow" data-act="quiz-plan" data-s="${P.subj}" data-n="${P.nq}"><span class="tile" style="background:#FF2D55">${ICON.quiz}</span><span class="pmain"><span class="pt">Quiz du jour</span><span class="ps">${P.nq} questions, tes erreurs en premier</span></span><span class="pchev">${ICON.chev}</span></button>`);
        if (P.cards) rows.push(ui.sheetRow({ href: "#cartes", i: "cards", t: "Cartes à revoir", end: count(P.cards) }));
        if (errN) rows.push(ui.sheetRow({ act: "quiz-errors", i: "quiz", t: "Mes erreurs", end: count(errN) }));

      ${["dc", "ip"].map(k => `<label class="stack" style="gap:4px"><span class="small" style="font-weight:600">${J.SUBJECTS[k].name}</span><input class="input" type="date" data-k="${k}" value="${esc(P[k] || "")}" min="${J.today()}"></label>`).join("")}

          : `<div class="card stack tint-rose">${ui.sayHTML("avocat", "Rédige d'abord, même brièvement. La correction ne s'envole pas, moi non plus.", false, true)}<p class="small muted">Conseil : suis les cinq étapes du syllogisme, une par paragraphe.</p></div>`}</div>

  ACT.exk = b => { EX.k = b.dataset.k; ui.rerender(); };

  ACT.exgo = b => { const k = b.dataset.k; const scope = k === "ch" ? "ch:" + $("#ex-ch").value : k === "s" ? "s:" + (EX.s || "dc") : "all"; buildExam(scope); ui.rerender(); };
  function buildExam(scope) {
    let chs, label, mins, nq, nd;
    if (scope.startsWith("ch:")) { chs = [scope.slice(3)]; label = "Examen · " + chLabel(chs[0]); mins = 20; nq = 8; nd = 3; }

    const elis = []; chs.forEach(id => J.byId[id].eli5.forEach(e => elis.push({ ch: id, e })));

  function startTimer() { clearInterval(J.timer); J.timer = setInterval(() => { const E = J.exam; if (!E || E.finished) { clearInterval(J.timer); return; } const left = E.dur - (Date.now() - E.start); const el = $("#ex-timer"); if (el) { el.textContent = fmt(left); el.classList.toggle("warn", left < 3 * 60e3); } if (left <= 0) { clearInterval(J.timer); E.finished = true; E.timeout = true; ui.rerender(); ui.toast("Temps écoulé : place à la correction."); } }, 1000); }
  const fmt = ms => { ms = Math.max(0, ms); const m = Math.floor(ms / 60e3), s = Math.floor(ms % 60e3 / 1e3); return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; };

  }
  const saveTxt = () => { const t = $("#ex-txt"); if (t && J.exam) J.exam.ans[J.exam.i] = t.value; };
  ACT.exsel = b => { const E = J.exam, it = E.items[E.i], o = +b.dataset.o, multi = it.q.a.length > 1; let s = E.ans[E.i] || []; if (multi) s = s.includes(o) ? s.filter(x => x !== o) : s.concat(o); else s = [o]; E.ans[E.i] = s; ui.rerender(); };
  ACT.exnext = () => { saveTxt(); const E = J.exam; if (E.i + 1 < E.items.length) { E.i++; ui.rerender(); } else { E.finished = true; clearInterval(J.timer); J.timer = null; ui.rerender(); } };
  ACT.exprev = () => { saveTxt(); J.exam.i--; ui.rerender(); };
  ACT.exend = () => { saveTxt(); J.exam.finished = true; clearInterval(J.timer); J.timer = null; ui.rerender(); };
  function examScore() {
    const E = J.exam; const q = E.items.map((it, i) => ({ it, i })).filter(x => x.it.t === "qcm");
    const qok = q.filter(x => { const s = E.ans[x.i] || []; return s.length === x.it.q.a.length && x.it.q.a.every(a => s.includes(a)); }).length;
    const w = E.items.map((it, i) => ({ it, i })).filter(x => x.it.t !== "qcm");
    const hasCas = w.some(x => x.it.t === "cas");
    const P = hasCas ? { qcm: 10, def: 4, refl: 2, cas: 4 } : { qcm: 12, def: 5, refl: 3, cas: 0 };
    let note = q.length ? qok / q.length * P.qcm : 0;
    ["def", "refl", "cas"].forEach(t => { const xs = w.filter(x => x.it.t === t); if (!xs.length) return; const got = xs.reduce((s, x) => s + (E.grades[x.i] || 0), 0), max = xs.reduce((s, x) => s + x.it.max, 0); note += got / max * P[t]; });
    const allGraded = w.every(x => E.grades[x.i] != null);

  }
  function examCorrection() {

      ${wrong.length ? `<div class="card stack"><h3>QCM manqués</h3>${wrong.map(x => `<div class="stack" style="gap:4px;padding-top:10px;border-top:1px solid var(--line)"><b>${esc(x.it.q.q)}</b><p class="small"><span style="color:var(--ok);font-weight:700">Réponse :</span> ${x.it.q.a.map(a => esc(x.it.q.o[a])).join(" ; ")}</p><p class="small muted">${esc(x.it.q.e)} · ${esc(x.it.q.n)}</p></div>`).join("")}</div>` : ""}
      <div class="card stack" style="align-items:flex-start">${E.saved ? `<h2>Note indicative : ${E.saved.note}/20</h2><p>${esc(E.saved.analysis)}</p>${ui.sayHTML(E.saved.note >= 14 ? "celebrate" : E.saved.note >= 10 ? "encourage" : "etudiant", E.saved.note >= 14 ? J.line("qcmReussi") : E.saved.note >= 10 ? J.line("moyen") : J.line("bas"), true, true)}<div class="row"><button class="btn pri" data-act="exnew">Nouvel examen</button><a class="btn sec" href="#progres">Ma progression</a></div>` : `<button class="btn pri" data-act="exfinal" ${sc.allGraded ? "" : "disabled"}>Calculer ma note · +50 XP</button>${sc.allGraded ? "" : `<p class="small muted">Note d'abord chaque réponse rédigée.</p>`}`}</div>`;
  }

  ACT.exfinal = () => {

    /* ---------- Markdown minimal et sûr ---------- */
    function md(src) {
      const inline = t => esc((t.match(/\*\*/g) || []).length % 2 ? t.replace(/\*\*(?!.*\*\*)/, "") : t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/__([^_]+)__/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\[\]]{2,90})\]/g, (m, x) => /p\.|constit|droit|ip\d|dc\d|chap/i.test(x) ? `<span class="ia-src">${x}</span>` : m);
      const out = []; let list = null, para = [];
      const flushP = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
      const flushL = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.t}>`); list = null; } };
      String(src || "").replace(/\r/g, "").split("\n").forEach(line => {
        const l = line.trim();
        let m;
        if (!l) { flushP(); flushL(); return; }
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(l)) { flushP(); flushL(); out.push("<hr>"); return; }
        if ((m = l.match(/^#{1,6}\s+(.*)$/))) { flushP(); flushL(); out.push(`<h4>${inline(m[1].replace(/\*\*/g, ""))}</h4>`); return; }
        if ((m = l.match(/^>\s?(.*)$/))) { flushP(); flushL(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); return; }

        if (list && /^\s{2,}/.test(line)) { list.items[list.items.length - 1] += " " + l; return; }
        if (/^\|.*\|$/.test(l)) { if (/^\|[\s:|-]+\|$/.test(l)) return; flushL(); para.push(l.slice(1, -1).split("|").map(x => x.trim()).join(" · ")); return; }
        flushL(); para.push(l);
      });
      flushP(); flushL();
      return out.join("");
    }

    /* ---------- Rendu ---------- */
    const SUGG = [["Explique-moi", "la différence entre déconcentration et décentralisation", "Explique-moi la différence entre déconcentration et décentralisation"], ["Fais-moi", "un mini-quiz sur la QPC", "Fais-moi un mini-quiz de 3 questions sur la QPC, une question à la fois"], ["Aide-moi", "à faire la fiche de l'arrêt Clément-Bayard", "Aide-moi à faire la fiche d'arrêt de Clément-Bayard"], ["Comment", "réussir un cas pratique en droit ?", "Comment réussir un cas pratique en droit ? Donne-moi la méthode"]];
    const IC = {
      up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>`,

    function msgHTML(m, i) {

      const chs = (m.chs || []).filter(id => J.byId[id]);

    const MAXIMG = 4;
    const attHTML = () => IA.att.length ? IA.att.map((a, k) => `<span class="ia-thumb"><img src="${a.thumb}" alt="Photo jointe ${k + 1}"><button type="button" data-act="ia-unatt" data-k="${k}" aria-label="Retirer la photo">×</button></span>`).join("") + `<span class="ia-atthint">Holly va corriger ${IA.att.length > 1 ? "ces photos" : "cette photo"}. Ajoute une question si tu veux.</span>` : "";
    function refreshAtt() { const el = document.getElementById("ia-att"); if (el) el.innerHTML = attHTML(); fitInput(); }
    function loadImg(file) {
      return new Promise((res, rej) => {
        const url = URL.createObjectURL(file), im = new Image();
        im.onload = () => { URL.revokeObjectURL(url); res(im); };
        im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("format")); };
        im.src = url;
      });
    }
    function shrink(im, max, q) {
      const r = Math.min(1, max / Math.max(im.naturalWidth || im.width, im.naturalHeight || im.height));
      const w = Math.max(1, Math.round((im.naturalWidth || im.width) * r)), h = Math.max(1, Math.round((im.naturalHeight || im.height) * r));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
      return c.toDataURL("image/jpeg", q);
    }
    async function addFiles(files) {

        try {

      }
      refreshAtt();
      const ta = document.getElementById("ia-q"); if (ta && matchMedia("(hover:hover) and (pointer:fine)").matches) ta.focus();
    }

    /* Mises à jour ciblées */
    const $m = () => document.getElementById("ia-main");
    function refreshMain() { const el = $m(); if (!el) return; el.innerHTML = mainHTML(); bindKeyForm(); }
    function refreshFoot() {
      const b = document.getElementById("ia-send"); if (b) { const t = document.createElement("div"); t.innerHTML = sendBtnHTML(); b.replaceWith(t.firstElementChild); }
      const sc = document.getElementById("ia-scopebox"); if (sc) sc.innerHTML = scopeHTML();
      const ta = document.getElementById("ia-q"); if (ta) { ta.disabled = IA.sample === null; ta.placeholder = IA.sample === null ? "Ajoute d'abord ta clé ci-dessus" : "Écris à Holly…"; fitInput(); }
      const nw = document.getElementById("ia-new"); if (nw) { nw.hidden = !IA.msgs.length; nw.disabled = IA.busy; }
      const hs = document.getElementById("ia-sub"); if (hs) hs.textContent = headSub();

    function fitInput() {
      const ta = document.getElementById("ia-q"), send = document.getElementById("ia-send"); if (!ta) return;
      ta.style.height = "auto"; ta.style.height = Math.min(200, ta.scrollHeight) + "px";
      if (onPage()) measure();
      if (send && !IA.busy) send.disabled = IA.sample === null || (!ta.value.trim() && !IA.att.length);
    }
    let raf = 0;

      const el = document.getElementById("ia-m-" + i); if (!el || !IA.msgs[i]) return;

    VIEWS.ia = {
      render() {

          <div class="ia-head">${avatar()}<div class="grow"><b>Holly</b><span class="sub" id="ia-sub">${headSub()}</span></div><button class="ia-new" id="ia-new" data-act="ia-clear" ${IA.msgs.length ? "" : "hidden"} ${IA.busy ? "disabled" : ""} aria-label="Nouvelle conversation" title="Nouvelle conversation">${IC.neu}</button></div>

    /* ---------- Envoi d'une question ---------- */
    const ERR = {
      not_granted: "Tu n'as pas autorisé cette page à interroger Claude. Réactive-le dans les autorisations de la page, puis réessaie.",

      session_expired: "Ta session Claude a expiré : recharge la page.",
      refused: "Holly ne peut pas répondre à cette question telle qu'elle est formulée. Essaie de la reformuler.",

    };
    async function ask(q, opts2 = {}) {
      if (IA.busy) return;
      let s = IA.sample;
      if (s === undefined) { IA.busy = true; refreshFoot(); s = await IA.ready; IA.busy = false; }
      if (!s) { refreshAll(); ui.toast("Holly dort encore : ajoute ta clé Gemini pour le réveiller."); return; }
      const prevUser = [...IA.msgs].reverse().find(m => m.role === "user");
      const picked = pickChapters(q, prevUser && prevUser.content);
      const used = picked.map(c => c.id);
      const base = opts2.retry ? IA.msgs.slice(0, -1) : IA.msgs;
      const history = base.filter(m => (m.content || m.imgs) && !m.pending).slice(-10).map(m => ({ role: m.role, content: (m.imgs && m.imgs.length ? `[${m.imgs.length > 1 ? m.imgs.length + " photos envoyées" : "Photo envoyée"}] ` : "") + (m.content || "") }));
      let full = opts2.retry ? (IA.msgs[IA.msgs.length - 1]._full || []) : IA.att.map(a => ({ mime: a.mime, data: a.data }));
      if (!opts2.retry) { IA.msgs.push({ role: "user", content: q, imgs: IA.att.length ? IA.att.map(a => a.thumb) : undefined, _full: full.length ? full : undefined }); IA.att = []; refreshAtt(); }
      const hasImg = full.length > 0;
      if (hasImg && !q) q = "Voici mon exercice (en photo). Corrige-moi.";
      const bot = { role: "assistant", content: "", pending: true, chs: used, step: "" };
      IA.msgs.push(bot);
      IA.busy = true; IA.draft = "";
      const ta = document.getElementById("ia-q"); if (ta && !opts2.retry) { ta.value = ""; }
      if (IA.msgs.length <= 2 || !document.getElementById("ia-log")) refreshMain();
      else { if (!opts2.retry) appendMsg(IA.msgs.length - 2); appendMsg(IA.msgs.length - 1); }
      refreshFoot(); IA.follow = true; requestAnimationFrame(() => scrollEnd(false));
      saveChat();

      const name = J.name();
      const sys = `${RULES.replace(/Jojo/g, name)}

CATALOGUE DES CHAPITRES (identifiant, titre, résumé) :
${CATALOGUE()}

CONTENU DES COURS — extraits les plus utiles pour la question :
${picked.length ? picked.map(chText).join("\n\n") : "(Aucun chapitre ne correspond directement : si la question touche quand même aux cours, appuie-toi sur le catalogue" + (IA.tools ? " et utilise les outils" : "") + " ; sinon, réponds comme juriste selon la règle 3.)"}`;
      const convo = alternate([...history, { role: "user", content: q, images: hasImg ? full : null }]);
      const isGem = s.engine === "gemini";
      const toClaude = list => list.map(m => m.images ? { role: m.role, content: [...m.images.map(im => ({ type: "image", source: { type: "base64", media_type: im.mime, data: im.data } })), { type: "text", text: m.content || "Corrige-moi." }] } : m);
      const input = isGem ? convo : toClaude(alternate([{ role: "user", content: sys }, { role: "assistant", content: `Compris. Je suis Holly, je réponds à ${name} en m'appuyant sur ses cours quand c'est possible, et je cite mes sources.` }, ...convo]));
      const ctl = IA.ctl = new AbortController();
      const opts = { signal: ctl.signal, cache: false, modelTier: "default", onText: ({ text }) => { bot.content = text; bot.step = ""; paintLast(); } };
      if (isGem) opts.system = sys;
      if (IA.tools && !isGem) opts.tools = makeTools(used, step => { bot.step = step; paintLast(); });

    const OR = { seq: 0, seen: new Set(), sayId: 0, fromTap: false, autoFail: false, subj: "", on: false, st: "idle", it: null, turns: [], log: [], score: { ok: 0, part: 0, ko: 0 }, n: 0, heard: "", typed: "", rec: null, noMic: false, ended: null };

          const E = OR.ended;
          return `
          <a href="#quiz" class="backlink">${ICON.back.replace("<svg", "<svg width=17 height=17")} Sushi Quiz</a>
          <header class="stack" style="gap:6px"><h1>À l'oral avec Holly</h1><p class="muted">Une vraie conversation : Holly t'interroge, tu réponds en parlant, elle te corrige et enchaîne.</p></header>
          ${LV.err ? `<div class="note">${esc(LV.err)}</div>` : ""}
          ${E ? `<section class="card stack" style="align-items:center;text-align:center"><span class="eyebrow">Dernier oral</span><h2 class="tnum">${E.ok} / ${E.ok + E.part + E.ko}</h2><p class="small muted">${E.part} presque · ${E.ko} à revoir (elles rejoignent « Mes erreurs » quand elles viennent du quiz)</p></section>` : ""}
          <section class="stack" style="gap:0"><p class="plabel">Matière</p><div class="seg wide">${[["all", "Les deux"], ["dc", "Constit."], ["ip", "Droit privé"]].map(([k, t]) => `<button class="${OR.subj === k ? "on" : ""}" data-act="or-subj" data-k="${k}">${t}</button>`).join("")}</div></section>
          <div class="or-start"><div style="width:120px">${H("prof")}</div>
            <button class="btn pri block" data-act="or-start">${E ? "Recommencer" : "Commencer l'oral"}</button>
            <p class="small muted" style="text-align:center">${noIA ? "Sans clé Gemini, Holly lit les questions et la réponse du cours, et c'est toi qui juges. Ajoute ta clé dans Réglages pour qu'elle te corrige." : liveOK() ? "Avec des écouteurs, c'est encore plus naturel." : "Avec des écouteurs, c'est encore mieux."}</p></div>`;
        }
        return `<div class="or-page"><span class="eyebrow" style="text-align:center">À l'oral avec Holly</span><div id="or-stage" class="or-stage">${stageHTML()}</div></div>`;
      },
      after() { if (LV.on) { paintLog(); return; } paint(); prewarm(); }
    };
    ACT["or-subj"] = b => { OR.subj = b.dataset.k; dropPre(); ui.rerender(); };
    ACT["or-start"] = (forceSimple) => {
      if (forceSimple !== true && liveOK() && !LV.on) { LV.err = ""; liveStart(); return; }
      OR.on = true; OR.log = []; OR.score = { ok: 0, part: 0, ko: 0 }; OR.n = 0; OR.ended = null; OR.err = ""; OR.typed = "";
      /* La première question part pendant le toucher : c'est ce qui autorise la voix sur iPhone. */
      ui.rerender(); ask();
    };
    ACT["or-mic"] = () => {
      if (OR.st === "listening") { if (OR.rec) { try { OR.rec.stop(); } catch (e) { } } return; }
      if (OR.st === "thinking") return;
      stopAll(); OR.fromTap = true; listen();
    };
    ACT["or-send"] = () => { const t = (OR.typed || "").trim(); if (!t) { ui.toast("Réponds d'abord, même en quelques mots."); return; } OR.typed = ""; answer(t); };
    ACT["or-repeat"] = () => { if (!OR.on || !OR.it) return; stopAll(); say(OR.it.q, listen); };
    ACT["or-skip"] = () => { if (!OR.on) return; stopAll(); ask(); };
    ACT["or-end"] = () => end();
    ACT["or-self"] = b => { const ok = b.dataset.v === "1"; ok ? OR.score.ok++ : OR.score.ko++; if (OR.it && OR.it.qref) J.answerQ(OR.it.qref, ok); J.addXP(ok ? 3 : 1, "Oral avec Holly", "oral"); ask(); };
  })();

  ui.mount();
})();

</script>

<script>
/* Jojo Boss Academy — connexion Google et sauvegarde en ligne de la progression (Firebase). Uniquement sur la version GitHub Pages. */
(function () {
  const J = window.JBA, S = J.S, ui = J.ui, ACT = ui.ACT, VIEWS = ui.VIEWS, esc = J.esc;
  if (!window.firebase) return;
  const cfg = {
    apiKey: "AIzaSyDVcKyj-L645ADs8Rdoqe9XJZ_zLpMy9j4",
    authDomain: "jojo-boss-academy.firebaseapp.com",
    projectId: "jojo-boss-academy",
    storageBucket: "jojo-boss-academy.firebasestorage.app",
    messagingSenderId: "103718353075",
    appId: "1:103718353075:web:af0b24f52439eeef48d8c6"
  };
  let auth, db;
  try { firebase.initializeApp(cfg); auth = firebase.auth(); db = firebase.firestore(); } catch (e) { return; }
  auth.useDeviceLanguage();
  const C = J.cloud = { user: null, status: "idle", last: null, ready: false };

  /* ---------- Envoi (débounce) ---------- */
  let pushT = null, applying = false;
  const push = async () => {
    if (!C.user) return;
    C.status = "saving"; badge();
    try {
      const data = Object.assign({}, S); delete data.theme;
      await db.collection("progress").doc(C.user.uid).set({ data: JSON.stringify(data), xp: S.xp, t: Date.now(), name: C.user.displayName || "" });
      C.status = "ok"; C.last = Date.now();
    } catch (e) { C.status = "error"; }
    badge();
  };
  const schedule = () => { if (!C.user || applying) return; clearTimeout(pushT); pushT = setTimeout(push, 1500); };
  const origSave = J.save;
  J.save = () => { origSave(); schedule(); };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && C.user && pushT) { clearTimeout(pushT); push(); } });

  /* ---------- Récupération à la connexion ---------- */
  const fresh = s => !s.xp && !(s.history || []).length && !Object.keys(s.q || {}).length && !Object.keys(s.cards || {}).length;
  async function pull() {
    C.status = "saving"; badge();
    try {
      const snap = await db.collection("progress").doc(C.user.uid).get();
      if (snap.exists) {
        const remote = JSON.parse(snap.data().data || "{}");
        const useRemote = fresh(S) || (remote.xp || 0) > (S.xp || 0);
        if (useRemote) {
          const theme = S.theme; applying = true;
          J.importData(JSON.stringify(Object.assign({}, remote, { v: 1, theme })));
          applying = false;
          ui.applyTheme && ui.applyTheme();
          ui.toast("Progression retrouvée : " + S.xp + " XP.");
        } else { await push(); }
      } else { await push(); }
      C.status = "ok"; C.last = Date.now();
    } catch (e) { applying = false; C.status = "error"; }
    C.ready = true; badge(); ui.rerender();
  }

  auth.onAuthStateChanged(u => {
    C.user = u || null;
    if (u) pull(); else { C.status = "idle"; C.ready = true; badge(); ui.rerender(); }
  });
  auth.getRedirectResult().catch(e => { if (e && e.code !== "auth/no-auth-event") ui.toast(errMsg(e)); });

  /* ---------- Connexion / déconnexion ---------- */
  const errMsg = e => ({
    "auth/popup-closed-by-user": "Connexion annulée.",
    "auth/cancelled-popup-request": "Connexion annulée.",
    "auth/network-request-failed": "Pas de connexion Internet.",
    "auth/unauthorized-domain": "Ce site n'est pas autorisé pour la connexion Google."
  })[e && e.code] || "La connexion n'a pas abouti. Réessaie dans un instant.";
  ACT.login = async () => {
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
    try { await auth.signInWithPopup(p); }
    catch (e) {
      if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) { try { await auth.signInWithRedirect(p); return; } catch (e2) { ui.toast(errMsg(e2)); return; } }
      if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") ui.toast(errMsg(e));
    }
  };
  ACT.logout = async () => { if (pushT) { clearTimeout(pushT); await push(); } await auth.signOut(); ui.toast("Déconnectée. Ta progression reste sauvegardée en ligne."); };
  ACT.syncnow = async () => { await push(); ui.toast(C.status === "ok" ? "Progression sauvegardée en ligne." : "Sauvegarde impossible pour l'instant."); ui.rerender(); };

  /* ---------- Interface ---------- */
  const G = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;
  const stateTxt = () => C.status === "saving" ? "Synchronisation…" : C.status === "error" ? "Hors ligne : la sauvegarde reprendra dès que possible" : C.last ? "Sauvegardé en ligne à " + new Date(C.last).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "Sauvegardé en ligne";
  function badge() { const el = document.getElementById("cloud-state"); if (el) el.textContent = stateTxt(); document.querySelectorAll(".cloud-sub").forEach(x => x.textContent = stateTxt()); }
  function card(compact) {
    if (!C.ready) return `<div class="card stack"><h3>Compte</h3><p class="small muted">Vérification de la connexion…</p></div>`;
    if (C.user) {
      const u = C.user;
      return `<div class="card stack"><h3>Compte</h3><div class="row" style="gap:12px">${u.photoURL ? `<img src="${esc(u.photoURL)}" alt="" width="40" height="40" style="border-radius:50%" referrerpolicy="no-referrer">` : ""}<div class="stack" style="gap:2px"><b>${esc(u.displayName || "Connectée")}</b><span class="small muted">${esc(u.email || "")}</span></div></div>
        <p class="small"><span style="color:var(--ok);font-weight:700">●</span> <span id="cloud-state">${stateTxt()}</span></p>
        <p class="small muted">Ta progression est enregistrée sur ton compte Google : connecte-toi avec le même compte sur ton iPhone ou ton Mac pour la retrouver.</p>
        <div class="row"><button class="btn sec sm" data-act="syncnow">Sauvegarder maintenant</button><button class="btn ghost sm" data-act="logout">Se déconnecter</button></div></div>`;
    }
    return `<div class="card stack"><h3>${compact ? "Retrouve ta progression partout" : "Compte"}</h3><p class="small muted">Connecte-toi avec Google pour sauvegarder ta progression en ligne et la retrouver sur l'iPhone, le Mac ou n'importe quel appareil. Sans connexion, elle reste enregistrée seulement sur cet appareil.</p><button class="btn sec" data-act="login" style="align-self:flex-start">${G} Se connecter avec Google</button></div>`;
  }
  const wrap = (name, where) => { const v = VIEWS[name]; if (!v) return; const r = v.render; v.render = function () { const h = r.apply(this, arguments); return where(h); }; };
  wrap("reglages", h => h.replace("</header>", "</header>" + `<section class="stack" style="gap:0"><p class="plabel">Compte</p>${ui.sheetGroups[0] ? ui.sheetGroups[0]() : card(false)}</section>`));
  /* Groupe « Compte » en tête de la feuille Plus */
  ui.sheetGroups.unshift(() => {
    if (!C.ready) return ui.sheetGroup("", [ui.sheetRow({ act: "noop", lead: `<span class="av">${G}</span>`, t: "Compte Google", sub: "Vérification…", end: "" }).replace('class="prow"', 'class="prow pacct"')]);
    if (C.user) {
      const u = C.user;
      const av = u.photoURL ? `<img class="av" src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : `<span class="av">${esc((u.displayName || "?")[0])}</span>`;
      return ui.sheetGroup("", [
        ui.sheetRow({ act: "noop", lead: av, t: esc(u.displayName || "Connectée"), sub: esc(u.email || ""), end: "" }).replace('class="prow"', 'class="prow pacct"'),
        ui.sheetRow({ act: "syncnow", i: "check", t: "Synchronisé", sub: `<span class="cloud-sub">${stateTxt()}</span>`, end: "" }).replace('<span class="tile" style="background:#8E8E93">', '<span class="tile" style="background:#34C759">'),
        ui.sheetRow({ act: "logout", lead: '<span class="tile" style="background:#FF3B30">' + ui.ICON.back + '</span>', t: '<span style="color:#FF3B30">Se déconnecter</span>', end: "" })
      ]);
    }
    return ui.sheetGroup("", [
      ui.sheetRow({ act: "login", lead: `<span class="av">${G.replace(/width="18" height="18"/, 'width="30" height="30"')}</span>`, t: "Se connecter avec Google", sub: "Synchronise ta progression", end: "" }).replace('class="prow"', 'class="prow pacct pgoogle"')
    ]);
  });
  ACT.noop = () => {};
  const origRerender = ui.rerender;
  ui.rerender = () => { origRerender(); ui.refreshSheet && ui.refreshSheet(); };
  ui.rerender();
})();

</script>
<script>window.JBA_BUILD="20261105-185016";
/* Mise à jour automatique : compare la version embarquée à version.json et recharge si une nouvelle version est en ligne. */
(function () {
  const B = window.JBA_BUILD; if (!B || !window.fetch) return;
  let busy = false;
  const check = async () => {
    if (busy) return; busy = true;
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      const v = (await r.json()).build;
      let last = null; try { last = sessionStorage.getItem("jba-reload"); } catch (e) { }
      if (v && v !== B && last !== v) {
        try { sessionStorage.setItem("jba-reload", v); } catch (e) { }
        location.replace(location.pathname + "?v=" + v + location.hash);
      }
    } catch (e) { }
    busy = false;
  };
  check();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
  const ui = window.JBA && window.JBA.ui, V = ui && ui.VIEWS && ui.VIEWS.reglages;
  if (V) { const r = V.render; V.render = function () { return r.apply(this, arguments).replace("Raccourci clavier", `Version ${B}. Raccourci clavier`); }; }
})();

</script>
